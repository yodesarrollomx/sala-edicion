<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sala">
<meta name="theme-color" content="#0a0a0c">
<title>Sala de Edición · Yo Desarrollo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Sala de un Toque · v2.1 (2-sep-2026): guardado visible, editar, zoom, contexto, tres pantallas. */
:root{
  --fondo:#f6f3ec; --tarjeta:#fffdf9; --linea:#e3ddd0; --linea2:#cfc7b6;
  --tinta:#1c1a16; --gris:#6f695e; --guia:#9a9284;
  --si:#2f8a5b; --si-suave:#e3f4ea; --no:#c0503f; --no-suave:#fbe9e5;
  --oro:#b08637; --oro-suave:#f7edd8; --azul:#3b6ea8; --azul-suave:#e6eef8;
  --serif:'Instrument Serif',Georgia,serif; --sans:'Instrument Sans',system-ui,sans-serif;
  --sombra:0 10px 30px rgba(28,26,22,.10); --sombra-alta:0 22px 55px rgba(28,26,22,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fondo:#131316; --tarjeta:#1b1b20; --linea:#2b2b33; --linea2:#3a3a45;
    --tinta:#f2efe8; --gris:#a09a90; --guia:#7d776e;
    --si:#57a582; --si-suave:#1c3529; --no:#d4796a; --no-suave:#3a221e;
    --oro:#d9b46f; --oro-suave:#332b19; --azul:#7fa6d9; --azul-suave:#1c2838;
    --sombra:0 10px 30px rgba(0,0,0,.45); --sombra-alta:0 22px 55px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --fondo:#131316; --tarjeta:#1b1b20; --linea:#2b2b33; --linea2:#3a3a45;
  --tinta:#f2efe8; --gris:#a09a90; --guia:#7d776e;
  --si:#57a582; --si-suave:#1c3529; --no:#d4796a; --no-suave:#3a221e;
  --oro:#d9b46f; --oro-suave:#332b19; --azul:#7fa6d9; --azul-suave:#1c2838;
  --sombra:0 10px 30px rgba(0,0,0,.45); --sombra-alta:0 22px 55px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--sans);
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.bloqueado{overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
img{max-width:100%}

/* ── armazón: móvil = 1 columna; ≥960 = mazo + panel ── */
.app{max-width:560px;margin:0 auto;padding:16px 16px 40px;min-height:100dvh;display:flex;flex-direction:column}
html.embed .app{padding-top:8px}
.panel-lateral{display:none}
@media (min-width:640px){ .app{max-width:640px;padding:22px 22px 48px} }
@media (min-width:960px){
  .app{max-width:1120px;display:grid;grid-template-columns:minmax(440px,560px) minmax(300px,1fr);
    grid-template-areas:"cab panel" "mazo panel" "tren tren";column-gap:32px;align-items:start}
  .cab{grid-area:cab} .mazo{grid-area:mazo} .camino{grid-area:tren}
  .panel-lateral{display:block;grid-area:panel;position:sticky;top:18px;
    background:var(--tarjeta);border:1px solid var(--linea);border-radius:20px;padding:20px;box-shadow:var(--sombra)}
}

/* ── cabecera ── */
.cab{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:4px;position:relative}
.cab .fecha{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--guia);font-weight:600;margin:0}
.cab h1{font-family:var(--serif);font-weight:400;font-size:29px;margin:2px 0 0;line-height:1.15;text-wrap:balance;padding:0 46px}
@media (min-width:960px){ .cab h1{padding:0} }
.cab h1 b{color:var(--oro);font-weight:400}
.engrane{position:absolute;right:0;top:-2px;width:42px;height:42px;border-radius:12px;border:1px solid var(--linea2);
  background:var(--tarjeta);display:grid;place-items:center;color:var(--gris)}
.engrane svg{width:20px;height:20px}
.engrane .punto{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--no);border:2px solid var(--fondo);display:none}
.engrane.avisa .punto{display:block}

/* ── estado de guardado: siempre a la vista ── */
.estado{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 13px;font-size:12.5px;
  font-weight:600;border:1px solid var(--linea2);background:var(--tarjeta);color:var(--gris);margin-top:4px;max-width:100%}
.estado i{width:9px;height:9px;border-radius:50%;background:var(--linea2);flex:none}
.estado.local i{background:var(--oro)} .estado.local{border-color:var(--oro);color:var(--oro)}
.estado.subiendo i{background:var(--azul);animation:late 1s infinite} .estado.subiendo{color:var(--azul);border-color:var(--azul)}
.estado.subido i{background:var(--si)} .estado.subido{color:var(--si);border-color:var(--si)}
.estado.cola i{background:var(--oro)} .estado.cola{color:var(--oro);border-color:var(--oro)}
.estado.sin i,.estado.rechazado i{background:var(--no)} .estado.sin,.estado.rechazado{color:var(--no);border-color:var(--no);cursor:pointer}
@keyframes late{0%,100%{opacity:1}50%{opacity:.3}}
.estado span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── progreso ── */
.bolas{display:flex;gap:9px;justify-content:center;margin:14px 0 6px;flex-wrap:wrap}
.bola{width:13px;height:13px;border-radius:50%;background:var(--linea2);transition:.35s;border:0;padding:0}
.bola.si{background:var(--si);transform:scale(1.18)}
.bola.no{background:var(--no);transform:scale(1.18)}
.bola.hoy{background:var(--oro);box-shadow:0 0 0 5px var(--oro-suave)}
.verresp{display:block;margin:0 auto 10px;background:none;border:0;color:var(--guia);font-size:13.5px;
  text-decoration:underline;text-underline-offset:3px}

/* ── contexto de la pieza (qué estoy decidiendo) ── */
.ctx{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:2px 0 12px}
@media (max-width:640px){ html.embed .ctx{display:none} html.embed .zona{height:clamp(420px,calc(100dvh - 300px),640px)} }
.ctx .et{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linea);border-radius:999px;
  padding:4px 11px;font-size:11.5px;color:var(--guia);background:var(--tarjeta)}
.ctx .et.on{border-color:var(--si);color:var(--si)} .ctx .et.aqui{border-color:var(--oro);color:var(--oro);font-weight:600}
.ctx .et i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* ── la carta ── */
.mazo{display:flex;flex-direction:column;min-height:0}
.zona{position:relative;min-height:min(78vw,440px);height:clamp(380px,calc(100dvh - 380px),640px)}
@media (min-width:640px){ .zona{height:clamp(480px,calc(100dvh - 330px),720px)} }
.carta{position:absolute;inset:0;background:var(--tarjeta);border:1px solid var(--linea);
  border-radius:22px;box-shadow:var(--sombra-alta);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s;touch-action:pan-y}
.carta.detras{transform:scale(.94) translateY(14px);box-shadow:var(--sombra);opacity:.55;z-index:0;pointer-events:none}
.carta.fuera-si{transform:translateX(115%) rotate(9deg);opacity:0}
.carta.fuera-no{transform:translateX(-115%) rotate(-9deg);opacity:0}
.lienzo{flex:1;position:relative;background:#141210;display:grid;place-items:center;min-height:0;cursor:zoom-in}
.lienzo img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .3s}
.lienzo img.lista{opacity:1}
.lienzo video{width:100%;max-height:100%;background:#000}
.cargando{position:absolute;inset:0;display:grid;place-items:center;color:#c9c2b4;font-size:13px;gap:10px;
  background:linear-gradient(110deg,#141210 30%,#1f1c18 50%,#141210 70%);background-size:200% 100%;animation:brilla 1.4s infinite}
@keyframes brilla{to{background-position:-200% 0}}
.fila-pie{display:flex;align-items:center;gap:10px;justify-content:space-between}
.lupa{flex:none;border:1px solid var(--linea2);border-radius:999px;background:var(--fondo);color:var(--tinta);font-size:12.5px;font-weight:600;padding:7px 12px;display:inline-flex;gap:6px;align-items:center}
.lupa svg{width:15px;height:15px}
.opciones{flex:1;overflow-y:auto;padding:16px}
.opciones .op{border:2px solid var(--linea);border-radius:16px;padding:15px;margin-bottom:12px;background:var(--fondo)}
.opciones .op h4{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 6px}
.opciones .op p{margin:0 0 12px;color:var(--gris);font-size:14px;white-space:pre-wrap}
.opciones .op button{width:100%;border:0;border-radius:12px;background:var(--oro);color:#191408;font-weight:600;min-height:48px}
.opciones .ning{display:block;margin:4px auto 0;background:none;border:0;color:var(--guia);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.pie{padding:11px 16px 12px;border-top:1px solid var(--linea);display:flex;flex-direction:column;gap:5px}
.pie .cual{font-size:13.5px;color:var(--gris)}
.pie .cual b{color:var(--tinta);font-weight:600}
.pie .luego{font-size:12px;color:var(--guia);display:flex;gap:10px;flex-wrap:wrap}
.pie .luego span{display:inline-flex;align-items:center;gap:5px}
.pie .luego i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pie .luego .s i{background:var(--si)} .pie .luego .n i{background:var(--no)}
.sello{position:absolute;top:18px;right:16px;font-family:var(--serif);font-size:30px;z-index:3;
  border:3px solid;border-radius:12px;padding:2px 14px;opacity:0;transform:rotate(-12deg) scale(.8);transition:.2s;pointer-events:none}
.sello.si{color:var(--si);border-color:var(--si);background:rgba(47,138,91,.2)}
.sello.no{color:var(--no);border-color:var(--no);background:rgba(192,80,63,.2);left:16px;right:auto;transform:rotate(12deg) scale(.8)}
.sello.ver{opacity:1;transform:rotate(-8deg) scale(1)} .sello.no.ver{transform:rotate(8deg) scale(1)}

/* ── mando: pegado abajo en móvil, siempre alcanzable ── */
.mando-wrap{position:sticky;bottom:0;padding:12px 0 calc(6px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--fondo) 70%,transparent);z-index:5}
.mando{display:flex;gap:12px}
.mando button{flex:1;border:2px solid var(--linea2);background:var(--tarjeta);color:var(--tinta);
  border-radius:20px;min-height:76px;font-size:16px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:.16s;box-shadow:var(--sombra)}
.mando button:active{transform:scale(.95)}
.mando .bSi{border-color:var(--si);color:var(--si);background:var(--si-suave)}
.mando .bNo{border-color:var(--no);color:var(--no);background:var(--no-suave)}
.mando svg{width:30px;height:30px}
.deshacer{margin:8px auto 0;display:block;background:none;border:0;color:var(--guia);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

/* ── hojas (nota, respuestas, máquinas, entrar) ── */
.velo{position:fixed;inset:0;background:rgba(20,18,14,.55);backdrop-filter:blur(3px);z-index:40;
  display:flex;align-items:flex-end;justify-content:center;padding:14px}
@media (min-width:640px){ .velo{align-items:center} }
.hoja{background:var(--tarjeta);border-radius:22px;padding:22px;width:100%;max-width:520px;max-height:min(88dvh,760px);
  overflow-y:auto;box-shadow:var(--sombra-alta);animation:sube .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sube{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.hoja h3{font-family:var(--serif);font-weight:400;font-size:23px;margin:0 0 4px}
.hoja p{margin:0 0 14px;color:var(--gris);font-size:14.5px}
.hoja textarea{width:100%;min-height:90px;border:2px solid var(--linea2);border-radius:14px;padding:13px;font:inherit;
  font-size:16px;background:var(--fondo);color:var(--tinta);resize:vertical}
.hoja textarea:focus{outline:none;border-color:var(--oro)}
.rapidas{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.rapidas button{border:1px solid var(--linea2);background:var(--fondo);color:var(--gris);border-radius:999px;padding:8px 14px;font-size:13.5px}
.rapidas button:hover{border-color:var(--oro);color:var(--tinta)}
.hoja .listo{width:100%;margin-top:14px;border:0;border-radius:16px;background:var(--oro);color:#191408;font-size:16px;font-weight:600;min-height:54px}
.hoja .secund{width:100%;margin-top:8px;border:2px solid var(--linea2);border-radius:16px;background:var(--tarjeta);font-size:15px;font-weight:600;min-height:48px}
.cerrar-h{float:right;border:0;background:none;font-size:22px;color:var(--guia);line-height:1;padding:0 4px}
.lista-r{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.fila-r{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;border:1px solid var(--linea);border-radius:14px;padding:8px 10px;background:var(--fondo)}
.fila-r .th{width:52px;height:64px;border-radius:8px;object-fit:cover;background:#141210;display:block}
.fila-r .txt{min-width:0;font-size:13.5px;line-height:1.35}
.fila-r .txt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila-r .txt small{color:var(--gris);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila-r .txt em{color:var(--no);font-style:normal;font-size:12.5px;display:block;white-space:normal}
.chipm{border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chipm.si{background:var(--si-suave);color:var(--si)} .chipm.no{background:var(--no-suave);color:var(--no)}
.chipm.pend{background:var(--oro-suave);color:var(--oro)} .chipm.lock{background:var(--linea);color:var(--gris)}
.fila-r .acc{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.fila-r .acc button{border:1px solid var(--linea2);background:var(--tarjeta);border-radius:999px;padding:5px 10px;font-size:12px}
.maq{border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--fondo);font-size:13.5px}
.maq b{display:flex;align-items:center;gap:8px;font-weight:600}
.maq b i{width:9px;height:9px;border-radius:50%;background:var(--linea2)}
.maq.bien b i{background:var(--si)} .maq.duda b i{background:var(--oro)} .maq.mal b i{background:var(--no)}
.maq small{color:var(--gris);display:block;margin-top:2px}
.falta{border-left:3px solid var(--oro);padding:8px 12px;background:var(--oro-suave);border-radius:10px;font-size:13.5px;margin-bottom:8px}

/* ── zoom ── */
.zoom{position:fixed;inset:0;background:#0a0908;z-index:60;touch-action:none;overflow:hidden;display:grid;place-items:center}
.zoom img{max-width:none;will-change:transform;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
.zoom .zx{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;border:0;
  background:rgba(255,255,255,.14);color:#fff;font-size:24px;line-height:1;z-index:2;backdrop-filter:blur(6px)}
.zoom .zt{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#cfc8ba;font-size:12.5px;
  background:rgba(0,0,0,.45);padding:6px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}

/* ── final / vacío ── */
.fin,.vacio-hoy{text-align:center;padding:30px 10px 10px}
.palomon{width:92px;height:92px;margin:0 auto 16px;border-radius:50%;background:var(--si-suave);display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.palomon svg{width:44px;height:44px;color:var(--si)}
.fin h2,.vacio-hoy h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:0 0 6px}
.fin p,.vacio-hoy p{color:var(--gris);margin:0 auto 4px;max-width:38ch}
.resumen{display:flex;gap:10px;justify-content:center;margin:18px 0 6px}
.rbox{background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:12px 18px;min-width:92px}
.rbox b{display:block;font-family:var(--serif);font-size:28px;line-height:1}
.rbox.si b{color:var(--si)} .rbox.no b{color:var(--no)}
.rbox span{font-size:12px;color:var(--guia)}
.fin .secund,.vacio-hoy .secund{margin-top:14px;border:2px solid var(--linea2);border-radius:16px;background:var(--tarjeta);padding:12px 22px;font-size:15px;font-weight:600}
.encamino{margin:18px auto 0;max-width:420px;text-align:left}
.encamino h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--guia);font-weight:600;margin:0 0 8px;text-align:center}
.enc{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--tarjeta);font-size:13.5px}
.enc i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--oro);margin-top:6px}
.enc b{display:block;font-weight:600}
.enc small{color:var(--gris)}

/* ── panel lateral (≥960) ── */
.panel-lateral h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--guia);font-weight:600;margin:0 0 10px}
.panel-lateral .bloque{margin-bottom:22px}
.panel-lateral .luego2{font-size:14px;color:var(--gris);line-height:1.55}
.panel-lateral .luego2 b{color:var(--tinta);font-weight:600}
.panel-lateral .lista-r .fila-r{grid-template-columns:44px 1fr auto}
.panel-lateral .fila-r .th{width:44px;height:54px}

/* ── tren + expediente ── */
.camino{margin-top:28px;border-top:1px solid var(--linea);padding-top:18px}
.camino h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--guia);font-weight:600;margin:0 0 14px;text-align:center}
.tren{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
@media (min-width:960px){ .tren{flex-wrap:wrap;justify-content:center} }
.vagon{flex:none;width:118px;text-align:center;border:0;background:none;padding:0;scroll-snap-align:start}
.vagon:active{transform:scale(.96)}
.vagon .mini{height:92px;border-radius:14px;border:2px solid var(--linea);position:relative;background:#141210;display:grid;place-items:center;overflow:hidden}
.vagon .mini img{width:100%;height:100%;object-fit:cover;opacity:.9}
.vagon.listo .mini{border-color:var(--si)} .vagon.espera .mini{border-color:var(--oro);box-shadow:0 0 0 4px var(--oro-suave)}
.vagon .est{position:absolute;bottom:0;left:0;right:0;font-size:10px;font-weight:600;padding:3px;background:rgba(20,18,14,.72);color:#f6f2ea;letter-spacing:.05em}
.vagon.listo .est{background:var(--si);color:#fff} .vagon.espera .est{background:var(--oro);color:#191408}
.vagon .nom{font-size:12px;color:var(--gris);margin-top:7px;line-height:1.3;display:block}
.candado{position:absolute;top:6px;right:6px;background:rgba(20,18,14,.75);border-radius:8px;padding:2px 6px;font-size:12px}
.nota-pie{text-align:center;color:var(--guia);font-size:12.5px;margin-top:14px}
.exp{position:fixed;inset:0;background:var(--fondo);z-index:30;overflow-y:auto;animation:entra .3s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.exp-in{max-width:640px;margin:0 auto;padding:14px 18px 60px}
.exp-top{position:sticky;top:0;background:var(--fondo);padding:10px 0 12px;z-index:2;display:flex;align-items:center;gap:12px}
.volver{border:2px solid var(--linea2);background:var(--tarjeta);border-radius:14px;width:46px;height:46px;display:grid;place-items:center;flex:none}
.volver svg{width:22px;height:22px}

</style></head><body>
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed');</script>

<div class="app">
  <div class="cab">
    <p class="fecha" id="fechaTxt">…</p>
    <h1 id="titulo">Abriendo la sala…</h1>

    <button class="engrane" id="engrane" aria-label="Máquinas y pedir /sala"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="punto"></span></button>
  </div>

  <div class="mazo">

      <div class="mando">

        <button class="bSi" id="btnSi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Sí — va</button>

</div>

<script>
/* ══ sesión — MISMO contrato que siempre: la liga mágica entra por el #hash ══ */
(function(){
  if(!location.hash) return;
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('gas')) localStorage.setItem('sala_gas',h.get('gas'));
  if(h.get('clave')) localStorage.setItem('sala_clave',h.get('clave'));
  if(h.get('rol')) localStorage.setItem('sala_rol',h.get('rol'));
  if(h.get('clave')) history.replaceState(null,'',location.pathname+location.search);   // la clave no se queda en la barra
})();
const GAS=()=>localStorage.getItem('sala_gas')||'';
const CLAVE=()=>localStorage.getItem('sala_clave')||'';
const ROL=()=>localStorage.getItem('sala_rol')||'editor';
const ENTRADO=()=>!!(GAS()&&CLAVE());
const ORIGEN_VIEJO='https://alexpueblag.github.io/sala-edicion/';
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uuid=()=>('xxxxxxxxyxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)}))+Date.now().toString(36);
const hora=()=>new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
function leerLS(k,def){ try{ const v=JSON.parse(localStorage.getItem(k)||'null'); return v===null?def:v }catch(e){ return def } }
async function leerJSON(r){ try{ return JSON.parse(await r.text()) }catch(e){ return null } }
const bloquear=on=>document.body.classList.toggle('bloqueado',!!on);
/* Las láminas PNG pesan ~1.5 MB; la carta pide primero la versión .jpg (~200 KB) y
   si no existe cae al PNG. En 4G esto es la diferencia entre carta negra y carta al instante. */
const ligera=src=>/\.png$/i.test(src||'')?src.replace(/\.png$/i,'.jpg'):src;
function imgConRespaldo(img,src){ img.src=ligera(src); img.onerror=()=>{ if(img.src!==src){ img.onerror=null; img.src=src } } }

/* ══ datos ══ */
async function traer(f,intentos){
  if(ENTRADO()){
    const N=intentos||3;
    for(let i=0;i<N;i++){
      try{
        const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),12000);
        const r=await fetch(GAS()+'?recurso=dia&clave='+encodeURIComponent(CLAVE())+(f?'&f='+encodeURIComponent(f):''),{signal:ctl.signal});
        clearTimeout(t);
        const j=await leerJSON(r);
        if(!r.ok||!j) throw new Error('sin JSON ('+r.status+')');
        if(j.error) throw new Error(j.error);
        return j;
      }catch(e){ if(i<N-1) await new Promise(res=>setTimeout(res,700*(i+1))) }
    }
  }
  const r=await fetch('datos/manifiesto.json?v='+Date.now());
  if(!r.ok) throw new Error('tampoco pude leer el respaldo');
  const j=await r.json(); j._respaldo=true; return j;
}
async function conMarcasDeAntes(d,f){
  if(d._respaldo) return d;
  const M=(d.decisiones&&d.decisiones.propuestas)||{};
  const falta=(d.propuestas||[]).map(p=>p.id).filter(id=>!M[id]);
  if(!falta.length){ d.decisiones={propuestas:M}; return d }
  const dias=(d.dias||[]).filter(x=>x<(d.fecha||f||'9999')).sort().reverse().slice(0,5);
  const set=new Set(falta);
  for(const dd of dias){
    if(!set.size) break;
    try{ const v=await traer(dd,1); const m=(v.decisiones&&v.decisiones.propuestas)||{};
      for(const id of [...set]) if(m[id]){ M[id]=m[id]; set.delete(id) } }catch(e){}
  }
  d.decisiones={propuestas:M}; return d;
}
function normalizarDia(j){
  const porId={};
  (j.propuestas||[]).forEach(p=>{
    if(p.opciones&&!Array.isArray(p.opciones)&&p.opciones.candidatas){ p.candidatas=p.opciones.candidatas; p.opciones=[] }
    porId[p.id]=p;
  });
  const fuera=new Set();
  Object.values(porId).forEach(p=>{
    const m=/rehecha-de (\S+)/.exec(p.origen||''); if(m) fuera.add(m[1]);
    if(/^retirada/i.test(p.origen||'')) fuera.add(p.id);
  });
  const M=(j.decisiones&&j.decisiones.propuestas)||{};
  // Un borrador de ESTE aparato más nuevo que la última revisión del Sheet manda:
  // sus propuestas no se filtran aunque el Sheet ya las dé por decididas.
  const fuerza=new Set();
  try{ const b=JSON.parse(localStorage.getItem('sala2-'+(j.fecha||''))||'null');
    const tSheet=Date.parse(j.ultima_revision||'')||0;
    if(b&&b.dec&&(b.t||0)>tSheet) Object.keys(b.dec).forEach(pid=>{ if((b.dec[pid].laminas||[]).some(m=>m==='si'||m==='no')) fuerza.add(pid) }) }catch(e){}
  j.propuestas=Object.values(porId).filter(p=>{
    if(fuera.has(p.id)) return false;
    if(fuerza.has(p.id)) return true;
    const f=M[p.id];
    if(p.tipo==='eje'){
      const n=(p.opciones||[]).length||0; if(!n) return false;
      if(!f||!f.laminas) return true;
      const m=f.laminas.slice(0,n); return !(m.some(x=>x==='si')||m.filter(x=>x==='no').length>=n);
    }
    const n=(p.laminas||[]).length||0; if(!n) return false;
    if(!f||!f.laminas) return true;
    let h=0; for(let i=0;i<n;i++) if(f.laminas[i]==='si'||f.laminas[i]==='no') h++;
    return h<n;
  });
  return j;
}

/* ══ estado del turno ══ */
let D=null, fecha='', pasos=[], idx=0, hist=[], dec={}, lockeadas=[], guard={tipo:'',texto:''};
const marcasPrevias=pid=>((D.decisiones||{}).propuestas||{})[pid]||null;
const claveBorrador=()=>'sala2-'+fecha;

function armarPasos(sinCandado){
  // sinCandado=true: hay un borrador en este aparato MÁS NUEVO que lo que trae el Sheet;
  // entonces sus láminas no se candan con la marca vieja — el borrador manda y sube.
  pasos=[]; dec={}; lockeadas=[];
  for(const p of D.propuestas||[]){
    const prev=sinCandado?null:marcasPrevias(p.id);
    if(p.tipo==='eje'){
      const n=(p.opciones||[]).length;
      dec[p.id]={laminas:new Array(n).fill(''),notas:new Array(n).fill(''),nota:'',_eje:''};
      pasos.push({tipo:'eje',pid:p.id,p});
    }else{
      const n=(p.laminas||[]).length;
      dec[p.id]={laminas:new Array(n).fill(''),notas:new Array(n).fill(''),nota:''};
      for(let i=0;i<n;i++){
        const ya=prev&&prev.laminas&&(prev.laminas[i]==='si'||prev.laminas[i]==='no');
        if(ya){ dec[p.id].laminas[i]=prev.laminas[i]; dec[p.id].notas[i]=(prev.notas||[])[i]||''; lockeadas.push({pid:p.id,i,p,marca:prev.laminas[i]}); continue }
        pasos.push({tipo:'lamina',pid:p.id,i,p});
      }
    }
  }
}
/* borrador: cada toque queda en este dispositivo al instante */
function guardarBorrador(){
  try{ localStorage.setItem(claveBorrador(),JSON.stringify({dec,idx,hist,pasos:pasos.map(x=>x.tipo+':'+x.pid+':'+(x.i??'')),t:Date.now(),env:guard.env||null})) }catch(e){}
}
function restaurarBorrador(){
  const b=leerLS(claveBorrador(),null); if(!b||!b.dec) return false;
  const firma=pasos.map(x=>x.tipo+':'+x.pid+':'+(x.i??'')).join('|');
  if((b.pasos||[]).join('|')!==firma) return false;
  for(const pid of Object.keys(dec)) if(b.dec[pid]) dec[pid]={...dec[pid],...b.dec[pid]};
  idx=Math.min(b.idx||0,pasos.length); hist=b.hist||[]; guard.env=b.env||null;
  while(idx<pasos.length&&marcaDe(pasos[idx])) idx++;   // nunca te para en una carta ya decidida
  return true;
}
const marcaDe=x=>x.tipo==='lamina'?dec[x.pid].laminas[x.i]:(dec[x.pid]._eje||'');
const cuentas=()=>({si:Object.values(dec).flatMap(d=>d.laminas).filter(m=>m==='si').length,
                    no:Object.values(dec).flatMap(d=>d.laminas).filter(m=>m==='no').length,
                    hoy:pasos.filter(x=>marcaDe(x)).length});

/* ══ estado de guardado, siempre visible ══ */
function pintarEstado(tipo,texto){
  guard.tipo=tipo; guard.texto=texto;
  const e=$('#estado'); e.className='estado '+tipo; e.querySelector('span').textContent=texto;
  const p=$('#pEstado'); if(p){ p.className='estado '+tipo; p.querySelector('span').textContent=texto }
  $('#engrane').classList.toggle('avisa',tipo==='sin'||tipo==='rechazado'||tipo==='cola');
}
function estadoInicial(){
  const c=cuentas();
  if(!ENTRADO()) return pintarEstado('sin', c.hoy?'Guardado aquí — falta entrar para subirlo':'No has entrado — toca para entrar');
  if(guard.env) return pintarEstado('subido','Subido al Sheet '+guard.env.hora);
  if(leerLS('sala_cola',[]).length) return pintarEstado('cola','Sin señal — sube solo al volver');
  return pintarEstado(c.hoy?'local':'', c.hoy?'Guardado aquí · subiendo…':'Nada decidido todavía');
}

/* ══ envío — sobre idéntico al de siempre; cada decisión sube sola ══ */
function sobre(){
  const envio={accion:'decidir',clave:CLAVE(),fecha,envio_id:uuid(),ts:Date.now(),quien:ROL(),nota_general:'',nota_estrategia:'',propuestas:{}};
  for(const p of D.propuestas||[]){
    const d=dec[p.id]; if(!d) continue;
    envio.propuestas[p.id]={nota:d.nota||'',laminas:d.laminas.map(m=>m||'pendiente'),notas:d.notas.slice(),mejoras:d.laminas.map(()=>[])};
  }
  return envio;
}
function encolar(envio){ const q=leerLS('sala_cola',[]); if(!q.some(x=>x.envio_id===envio.envio_id)) q.push(envio); localStorage.setItem('sala_cola',JSON.stringify(q)) }
let _tSubir=null, _subiendo=false;
function programarSubida(){ guardarBorrador(); if(!ENTRADO()){ estadoInicial(); return }
  pintarEstado('local','Guardado aquí · subiendo…'); clearTimeout(_tSubir); _tSubir=setTimeout(subir,1200) }
async function subir(){
  if(!ENTRADO()||_subiendo||!cuentas().hoy) return; _subiendo=true;
  pintarEstado('subiendo','Subiendo al Sheet…');
  const envio=sobre();
  try{
    const r=await fetch(GAS(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(envio)});
    const j=await leerJSON(r);
    if(j&&/solo lee/i.test(String(j.error||''))){ pintarEstado('rechazado','Tu liga es de solo lectura — toca para entrar'); _subiendo=false; return }
    if(!r.ok||!j||j.ok!==true) throw new Error((j&&j.error)||'el Sheet no contestó');
    guard.env={id:envio.envio_id,hora:hora()}; guardarBorrador();
    localStorage.setItem('sala_cola',JSON.stringify(leerLS('sala_cola',[]).filter(x=>x.fecha!==fecha)));
    pintarEstado('subido','Subido al Sheet '+guard.env.hora);
  }catch(e){ encolar(envio); pintarEstado('cola','Sin señal — quedó aquí y sube solo') }
  _subiendo=false;
}
async function subirCola(){
  const q=leerLS('sala_cola',[]); if(!q.length||!ENTRADO()) return;
  q.forEach(e=>{if(!e.clave)e.clave=CLAVE()});
  const resto=[];
  for(const envio of q){
    try{ const r=await fetch(GAS(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(envio)});
      const j=await leerJSON(r);
      if(!r.ok||!j||j.ok!==true){ if(j&&/no encontr|solo lee/i.test(String(j.error||''))) continue; throw 0 } }
    catch(e){ resto.push(envio) }
  }
  localStorage.setItem('sala_cola',JSON.stringify(resto));
  if(!resto.length&&q.length&&guard.tipo==='cola') pintarEstado('subido','Subido al Sheet '+hora());
}

/* ══ pintado ══ */
function etapaDe(p){ if(p.tipo==='eje'&&p.video) return 'video'; if(p.tipo==='eje') return /copy/i.test(p.titulo||'')?'copy':'guion'; return 'láminas' }
function pintarCtx(x){
  const c=$('#ctx'); if(!x){ c.innerHTML=''; return }
  const ET=['idea','guion','láminas','video','copy','publicada']; const aqui=etapaDe(x.p); const k=ET.indexOf(aqui);
  c.innerHTML=ET.map((e,i)=>`<span class="et ${i<k?'on':''} ${i===k?'aqui':''}"><i></i>${e}</span>`).join('');
}
function luegoDe(x){
  if(x.tipo==='eje') return `<div class="luego"><span class="s"><i></i>Eliges una → se ejecuta de inmediato</span></div>`;
  return `<div class="luego"><span class="s"><i></i>Sí → queda con candado</span><span class="n"><i></i>No → la rehago con tu nota y vuelve aquí</span></div>`;
}
function pintarBolas(){
  $('#bolas').innerHTML=pasos.map((x,k)=>{ const m=marcaDe(x);
    return `<button class="bola ${m==='si'?'si':m==='no'?'no':''} ${k===idx&&!m?'hoy':''}" data-k="${k}" aria-label="paso ${k+1}"></button>`}).join('');
  $('#bolas').querySelectorAll('.bola').forEach(b=>b.onclick=()=>irA(+b.dataset.k));
  $('#verresp').hidden=!(pasos.length&&(cuentas().hoy||lockeadas.length));
}
function pintarCartas(){
  const z=$('#zona');
  if(!pasos.length){ pintarVacio(); return }
  if(idx>=pasos.length){ pintarFin(); return }
  const r=pasos.length-idx; $('#titulo').innerHTML=`Te toca ver <b>${r===1?'1 cosa':r+' cosas'}</b>`;
  z.innerHTML='';
  for(let k=Math.min(idx+1,pasos.length-1);k>=idx;k--){
    const x=pasos[k], el=document.createElement('div');
    el.className='carta'+(k>idx?' detras':''); el.dataset.k=k;
    if(x.tipo==='lamina'){
      const src=x.p.laminas[x.i];
      el.innerHTML=`<div class="lienzo" data-zoom="${esc(src)}">
          <div class="cargando">cargando lámina…</div>
          <span class="sello si" data-si>SÍ</span><span class="sello no" data-no>NO</span>
          <img alt="Lámina ${x.i+1}" draggable="false">
        </div>
        <div class="pie"><div class="fila-pie"><span class="cual"><b>${esc(x.p.titulo||x.pid)}</b> · lámina ${x.i+1} de ${(x.p.laminas||[]).length}</span>
          <button class="lupa" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg>Ampliar</button></div>${luegoDe(x)}</div>`;
      const img=el.querySelector('img');
      const lista=()=>{ img.classList.add('lista'); const c=el.querySelector('.cargando'); if(c) c.remove() };
      img.onload=lista;
      img.src=ligera(src);
      img.onerror=()=>{ if(img.src!==src&&!img.src.endsWith(src)){ img.src=src; return }   // sin .jpg → PNG
        const c=el.querySelector('.cargando'); if(c) c.textContent='no cargó la imagen — toca Ampliar para reintentar' };
      if(img.complete&&img.naturalWidth) lista();
      el.querySelector('.lupa').onclick=e=>{ e.stopPropagation(); abrirZoom(src) };
      el.querySelector('.lienzo').addEventListener('click',e=>{ if(Math.abs(_dxUlt)<8) abrirZoom(src) });
    }else{
      const ops=(x.p.opciones||[]).map((o,j)=>`<div class="op"><h4>${esc(o.titulo||('Opción '+(j+1)))}</h4><p>${esc(o.texto||'')}</p><button data-op="${j}">Ésta ✓</button></div>`).join('');
      el.innerHTML=`${x.p.video?`<div class="lienzo" style="flex:0 0 38%;cursor:default"><video src="${esc(x.p.video)}" controls playsinline preload="metadata"></video></div>`:''}
        <div class="opciones">${ops}<button class="ning" data-ning>Ninguna me late — te dejo nota</button></div>
        <div class="pie"><span class="cual"><b>${esc(x.p.titulo||x.pid)}</b> · elige una</span>${luegoDe(x)}</div>`;
      el.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{ dec[x.pid].laminas=dec[x.pid].laminas.map(()=>''); dec[x.pid].laminas[+b.dataset.op]='si'; dec[x.pid]._eje='si'; avanzar('si') });
      el.querySelector('[data-ning]').onclick=()=>pedirNota(nota=>{ dec[x.pid].laminas=dec[x.pid].laminas.map(()=>'no'); dec[x.pid].nota=nota; dec[x.pid]._eje='no'; avanzar('no') });
    }
    z.appendChild(el);
    if(k===idx&&x.tipo==='lamina') arrastrar(el);
  }
  // precarga las dos siguientes para que no aparezcan negras
  pasos.slice(idx+1,idx+3).forEach(x=>{ if(x.tipo==='lamina'){ const im=new Image(); im.src=ligera(x.p.laminas[x.i]) } });
  $('#mandoWrap').hidden=pasos[idx].tipo!=='lamina';
  $('#deshacer').hidden=hist.length===0;
  pintarCtx(pasos[idx]); pintarBolas(); pintarPanel();
}
let _dxUlt=0;
function arrastrar(el){
  let x0=null,dx=0; const si=el.querySelector('[data-si]'), no=el.querySelector('[data-no]');
  el.addEventListener('pointerdown',e=>{ if(e.target.closest('.lupa')) return; x0=e.clientX; dx=0; el.style.transition='none' });
  el.addEventListener('pointermove',e=>{ if(x0===null) return; dx=e.clientX-x0; _dxUlt=dx;
    el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`; si.classList.toggle('ver',dx>55); no.classList.toggle('ver',dx<-55) });
  const fin=()=>{ if(x0===null) return; el.style.transition='';
    if(dx>110){x0=null;decidir('si')} else if(dx<-110){x0=null;decidir('no')}
    else{el.style.transform='';si.classList.remove('ver');no.classList.remove('ver')}
    x0=null; setTimeout(()=>{_dxUlt=0},50); dx=0 };
  el.addEventListener('pointerup',fin); el.addEventListener('pointercancel',fin); el.addEventListener('pointerleave',fin);
}
function decidir(m){
  const x=pasos[idx]; if(!x||x.tipo!=='lamina') return;
  if(m==='no'){ pedirNota(nota=>{ dec[x.pid].laminas[x.i]='no'; dec[x.pid].notas[x.i]=nota; avanzar('no') }); return }
  dec[x.pid].laminas[x.i]='si'; dec[x.pid].notas[x.i]=''; avanzar('si');
}
function avanzar(m){
  const el=document.querySelector(`.carta[data-k="${idx}"]`); if(el) el.classList.add(m==='si'?'fuera-si':'fuera-no');
  hist.push(idx); pintarBolas(); programarSubida();
  setTimeout(()=>{ idx++; guardarBorrador(); pintarCartas() },300);
}
function irA(k){ // volver a una carta: se reabre para cambiarla
  if(k<0||k>=pasos.length) return;
  const x=pasos[k];
  if(x.tipo==='lamina'){ dec[x.pid].laminas[x.i]=''; dec[x.pid].notas[x.i]='' } else { dec[x.pid].laminas=dec[x.pid].laminas.map(()=>''); dec[x.pid]._eje='' }
  idx=k; guardarBorrador(); cerrarHojas(); pintarCartas();
}
function reabrir(l){ // 🔒 de días anteriores: solo tú lo abres
  dec[l.pid].laminas[l.i]=''; dec[l.pid].notas[l.i]='';
  lockeadas=lockeadas.filter(z=>!(z.pid===l.pid&&z.i===l.i));
  pasos.push({tipo:'lamina',pid:l.pid,i:l.i,p:l.p});
  idx=pasos.length-1; guardarBorrador(); cerrarHojas(); pintarCartas();
}

/* ══ zoom: pellizco, rueda, doble toque, arrastre ══ */
function abrirZoom(src){
  bloquear(true);
  const z=document.createElement('div'); z.className='zoom';
  z.innerHTML=`<img src="${esc(src)}" alt="Lámina ampliada"><button class="zx" aria-label="Cerrar">×</button><div class="zt">Pellizca o doble toque para acercar · desliza para mover</div>`;
  document.body.appendChild(z);
  const img=z.querySelector('img'); let s=1,tx=0,ty=0,base=1,W=0,H=0;
  const aplicar=()=>{ img.style.transform=`translate(${tx}px,${ty}px) scale(${s})` };
  const ajustar=()=>{ const vw=innerWidth,vh=innerHeight; const nw=img.naturalWidth||1080,nh=img.naturalHeight||1350;
    base=Math.min(vw/nw,vh/nh); W=nw*base; H=nh*base; s=1; tx=(vw-W)/2; ty=(vh-H)/2; img.style.width=W+'px'; img.style.height=H+'px'; aplicar() };
  if(img.complete&&img.naturalWidth) ajustar(); else img.onload=ajustar;
  const pts=new Map(); let d0=0,s0=1,c0=null,ultimoTap=0,pan0=null;
  const acotar=()=>{ s=Math.max(1,Math.min(5,s)); const w=W*s,h=H*s;
    tx=w<=innerWidth?(innerWidth-w)/2:Math.min(0,Math.max(innerWidth-w,tx)); ty=h<=innerHeight?(innerHeight-h)/2:Math.min(0,Math.max(innerHeight-h,ty)) };
  const zoomEn=(cx,cy,ns)=>{ const k=ns/s; tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; s=ns; acotar(); aplicar() };
  z.addEventListener('pointerdown',e=>{ if(e.target.closest('.zx')) return; z.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1){ pan0=[e.clientX-tx,e.clientY-ty]; const t=Date.now(); if(t-ultimoTap<300){ zoomEn(e.clientX,e.clientY,s>1.2?1:2.5); ultimoTap=0 } else ultimoTap=t }
    if(pts.size===2){ const [a,b]=[...pts.values()]; d0=Math.hypot(a[0]-b[0],a[1]-b[1]); s0=s; c0=[(a[0]+b[0])/2,(a[1]+b[1])/2] } });
  z.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); zoomEn(c0[0],c0[1],s0*d/(d0||1)) }
    else if(pts.size===1&&pan0){ tx=e.clientX-pan0[0]; ty=e.clientY-pan0[1]; acotar(); aplicar() } });
  const soltar=e=>{ pts.delete(e.pointerId); if(pts.size<2){ d0=0 } if(!pts.size) pan0=null };
  z.addEventListener('pointerup',soltar); z.addEventListener('pointercancel',soltar);
  z.addEventListener('wheel',e=>{ e.preventDefault(); zoomEn(e.clientX,e.clientY,s*(e.deltaY<0?1.15:0.87)) },{passive:false});
  const cerrar=()=>{ z.remove(); if(!document.querySelector('.exp,.velo')) bloquear(false); document.removeEventListener('keydown',tecla) };
  const tecla=ev=>{ if(ev.key==='Escape') cerrar() };
  z.querySelector('.zx').onclick=cerrar; document.addEventListener('keydown',tecla);
  addEventListener('resize',ajustar,{once:true});
}

let EXP={}, METR=null;
async function cargarExpedientes(){
  try{ METR=await (await fetch('datos/metricas.json?v='+Date.now())).json() }catch(e){}
  try{ const z=await (await fetch('datos/piezas.json?v='+Date.now())).json();
    (z.piezas||[]).forEach(p=>{ PZ[p.pieza]={...p,actualizado:z.actualizado} }) }catch(e){}
  let idxE=[]; try{ idxE=await (await fetch('datos/expedientes/index.json?v='+Date.now())).json() }catch(e){}
  for(const it of idxE){ try{ EXP[it.pieza]=await (await fetch('datos/expedientes/'+it.archivo+'?v='+Date.now())).json();
    if(PZ[it.pieza]) EXP[it.pieza].estado=PZ[it.pieza].estado;   // el estado vivo manda sobre el archivado
  }catch(e){} }
  pintarTren(); if(D&&!pasos.length) pintarVacio();
}
const estCls=e=>e==='publicada'?'listo':(e==='te espera'?'espera':'');
const estTxt=e=>e==='publicada'?'YA SALIÓ':(e==='te espera'?'TE ESPERA':(e==='en camino'?'EN CAMINO':'EN IDEA'));
function miniDe(n){ return {'¿Vendo o construyo?':'laminas/vendo-construyo-g2/L3.png','El Apodo del Terreno':'laminas/apodo-g4/L1.png'}[n]||'' }
function pintarTren(){
  const piezas=Object.entries(EXP);
  if(!piezas.length){ $('#tren').innerHTML='<p class="nota-pie">La historia se está escribiendo…</p>'; return }
  $('#tren').innerHTML=piezas.map(([n,e])=>{ const src=miniDe(n);
    return `<button class="vagon ${estCls(e.estado)}" data-n="${esc(n)}"><span class="mini">${src?`<img src="${esc(ligera(src))}" alt="" loading="lazy">`:''}${e.estado==='publicada'?'<span class="candado">🔒</span>':''}<span class="est">${estTxt(e.estado)}</span></span><span class="nom">${esc(n)}</span></button>` }).join('');
  document.querySelectorAll('.vagon').forEach(v=>v.onclick=()=>abrirExp(v.dataset.n));
}
function abrirExp(nombre){
  const e=EXP[nombre]; if(!e) return; bloquear(true);
  const d=document.createElement('div'); d.className='exp';
  const check='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  let resultado=e.resultado;
  if(nombre==='La Servilleta'&&METR&&METR[0]&&METR[0].ig&&!METR[0].ig.error){ const g=METR[0].ig; resultado=[[String(g.views??'–'),'vistas IG'],[String(g.reach??'–'),'alcance'],[String(g.likes??'–'),'me gusta']] }
  d.innerHTML=`<div class="exp-in"><div class="exp-top"><button class="volver" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><h2>${esc(nombre)}</h2><span class="chip-est ${estCls(e.estado)||'idea'}">${estTxt(e.estado)}</span></div>
    ${resultado?`<div class="result">${resultado.map(r=>`<div><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}</div>`:''}
    ${e.post?`<a class="verpost" href="${esc(e.post)}" target="_blank" rel="noopener">Ver la publicación ↗</a>`:''}
    ${(e.versiones||[]).length?`<div class="carrete">${e.versiones.map(v=>`<div class="ver ${v.viva?'viva':''}"><div class="mini2"><span class="tg">${v.viva?'LA BUENA':esc((v.tag||'').toUpperCase())}</span></div><small>${esc(v.fecha||'')}</small></div>`).join('')}</div>`:''}
    <div class="linea-t">${(e.hitos||[]).map(h=>`<div class="hito ${h.quien==='tu'?'tu':'yo'}"><p class="cuando">${esc(h.fecha||'')} · ${h.quien==='tu'?'tú decidiste':'se hizo'}</p><p class="que">${esc(h.que||'')}</p>
        ${h.dijo?`<p class="dijo">«${esc(h.dijo)}»</p>`:''}${h.hecho?`<p class="paso-a">${check}<span>${esc(h.hecho)}</span></p>`:''}
        ${h.antes_despues?`<div class="ad"><div class="cuadro">${esc(h.antes_despues[0])}<span>ANTES</span></div><span class="flecha">→</span><div class="cuadro nueva">${esc(h.antes_despues[1])}<span>AHORA</span></div></div>`:''}
        ${h.fuente?`<p class="fuente">fuente: ${esc(h.fuente)}</p>`:''}</div>`).join('')}</div>
    ${(e.reglas||[]).length?`<div class="reglas"><h3>Reglas que nacieron aquí</h3>${e.reglas.map(r=>`<div class="regla-c"><p><b>${esc(r.regla)}</b></p><small>${esc(r.nacio||'')}</small></div>`).join('')}</div>`:''}</div>`;
  document.body.appendChild(d);
  const cerrar=()=>{ d.remove(); if(!document.querySelector('.velo,.zoom')) bloquear(false); document.removeEventListener('keydown',escf) };
  const escf=ev=>{ if(ev.key==='Escape') cerrar() };
  d.querySelector('.volver').onclick=cerrar; document.addEventListener('keydown',escf);
}

/* ══ arranque ══ */
function pintarFecha(f){ try{ $('#fechaTxt').textContent=new Date(f+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'}) }catch(e){ $('#fechaTxt').textContent=f } }
let _pintado=false;
function montar(d){
  D=d; fecha=D.fecha||''; pintarFecha(fecha);
  // Si en este aparato hay respuestas MÁS NUEVAS que la última revisión que tiene el
  // Sheet (p. ej. decidiste sin sesión), esas mandan: no se candan, se restauran y suben.
  const b=leerLS('sala2-'+fecha,null);
  const tSheet=Date.parse(D.ultima_revision||'')||0;
  const borradorManda=!!(b&&b.dec&&(b.t||0)>tSheet&&Object.values(b.dec).some(x=>(x.laminas||[]).some(m=>m==='si'||m==='no')));
  armarPasos(borradorManda);
  const hubo=restaurarBorrador(); if(!hubo){ idx=0; hist=[] }
  estadoInicial(); pintarCartas();
  if(hubo&&idx>0&&idx<pasos.length) $('#titulo').innerHTML=`Retomas donde ibas: <b>${pasos.length-idx} por ver</b>`;
}
(async function(){
  cargarExpedientes(); subirCola();
  const rapido=setTimeout(async()=>{ try{ const r=await fetch('datos/manifiesto.json?v='+Date.now()); if(!r.ok) return; const j=await r.json(); j._respaldo=true; if(!_pintado) montar(normalizarDia(j)) }catch(e){} },2500);
  try{ const d=normalizarDia(await conMarcasDeAntes(await traer(),'')); clearTimeout(rapido); _pintado=true; montar(d) }
  catch(e){ clearTimeout(rapido); if(!_pintado){ try{ const r=await fetch('datos/manifiesto.json?v='+Date.now()); const j=await r.json(); j._respaldo=true; _pintado=true; montar(normalizarDia(j)) }
    catch(e2){ $('#titulo').textContent='No pude alcanzar la sala'; pintarEstado('sin','Puede ser la red — recarga en un momento') } } }
})();
$('#btnSi').onclick=()=>decidir('si'); $('#btnNo').onclick=()=>decidir('no');
$('#deshacer').onclick=()=>{ if(!hist.length) return; irA(hist.pop()) };
$('#verresp').onclick=abrirRespuestas; $('#estado').onclick=clickEstado; $('#engrane').onclick=abrirMaquinas;
document.addEventListener('keydown',e=>{ if(document.querySelector('.velo,.exp,.zoom')) return; if(e.key==='ArrowRight') decidir('si'); if(e.key==='ArrowLeft') decidir('no') });
window.addEventListener('online',subirCola);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ guardarBorrador(); if(_tSubir){ clearTimeout(_tSubir); subir() } } });
window.addEventListener('resize',()=>pintarPanel());
