<!doctype html>
<html lang="es"><head><meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Sala de un Toque — producción. Una carta a la vez; el resto es historia. */
:root{
  --fondo:#f6f3ec; --tarjeta:#fffdf9; --linea:#e3ddd0; --linea2:#cfc7b6;
  --tinta:#1c1a16; --gris:#6f695e; --guia:#9a9284;
  --si:#2f8a5b; --si-suave:#e3f4ea; --no:#c0503f; --no-suave:#fbe9e5;
  --oro:#b08637; --oro-suave:#f7edd8;
  --serif:'Instrument Serif',Georgia,serif; --sans:'Instrument Sans',system-ui,sans-serif;
  --sombra:0 10px 30px rgba(28,26,22,.10); --sombra-alta:0 22px 55px rgba(28,26,22,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fondo:#131316; --tarjeta:#1b1b20; --linea:#2b2b33; --linea2:#3a3a45;
    --tinta:#f2efe8; --gris:#a09a90; --guia:#7d776e;
    --si:#57a582; --si-suave:#1c3529; --no:#d4796a; --no-suave:#3a221e;
    --oro:#d9b46f; --oro-suave:#332b19;
    --sombra:0 10px 30px rgba(0,0,0,.45); --sombra-alta:0 22px 55px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --fondo:#131316; --tarjeta:#1b1b20; --linea:#2b2b33; --linea2:#3a3a45;
  --tinta:#f2efe8; --gris:#a09a90; --guia:#7d776e;
  --si:#57a582; --si-suave:#1c3529; --no:#d4796a; --no-suave:#3a221e;
  --oro:#d9b46f; --oro-suave:#332b19;
  --sombra:0 10px 30px rgba(0,0,0,.45); --sombra-alta:0 22px 55px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--sans);
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
.app{max-width:520px;margin:0 auto;padding:22px 18px 40px;min-height:100dvh;display:flex;flex-direction:column}
html.embed .app{padding-top:12px}
.cab{text-align:center;margin-bottom:6px}
.cab .fecha{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--guia);font-weight:600}
.cab h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:8px 0 0;line-height:1.15}
.cab h1 b{color:var(--oro);font-weight:400}

.aviso.malo{color:var(--no)}
.bolas{display:flex;gap:9px;justify-content:center;margin:18px 0 16px;flex-wrap:wrap}
.bola{width:13px;height:13px;border-radius:50%;background:var(--linea2);transition:.35s}
.bola.si{background:var(--si);transform:scale(1.18)}
.bola.no{background:var(--no);transform:scale(1.18)}
.bola.hoy{background:var(--oro);box-shadow:0 0 0 5px var(--oro-suave)}
.zona{position:relative;flex:1;min-height:440px}
.carta{position:absolute;inset:0;background:var(--tarjeta);border:1px solid var(--linea);

  transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s;touch-action:pan-y}
.carta.detras{transform:scale(.94) translateY(14px);box-shadow:var(--sombra);opacity:.55;z-index:0;pointer-events:none}
.carta.fuera-si{transform:translateX(115%) rotate(9deg);opacity:0}
.carta.fuera-no{transform:translateX(-115%) rotate(-9deg);opacity:0}

.lienzo img{width:100%;height:100%;object-fit:contain}

.chip-est{border-radius:999px;padding:5px 13px;font-size:12px;font-weight:600;white-space:nowrap}

.result span{font-size:11px;color:var(--guia)}
.verpost{display:block;text-align:center;color:var(--oro);font-size:14px;font-weight:600;

.carrete{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;margin-bottom:6px}
.ver{flex:none;width:82px;text-align:center}
.ver .mini2{height:62px;border-radius:11px;border:2px solid var(--linea);background:#141210;position:relative;overflow:hidden;display:grid;place-items:center}
.ver .mini2 span.tg{position:absolute;bottom:0;left:0;right:0;font-size:9px;font-weight:600;padding:2px;background:rgba(20,18,14,.78);color:#f6f2ea}

.ver.viva .mini2 span.tg{background:var(--si);color:#fff}
.ver small{display:block;font-size:11px;color:var(--guia);margin-top:5px}
.linea-t{position:relative;padding-left:34px;margin-top:10px}
.linea-t::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:var(--linea)}
.hito{position:relative;margin-bottom:20px}
.hito::before{content:"";position:absolute;left:-28px;top:5px;width:16px;height:16px;border-radius:50%;
  background:var(--fondo);border:3px solid var(--linea2)}
.hito.tu::before{border-color:var(--oro);background:var(--oro)}
.hito.yo::before{border-color:var(--si);background:var(--si)}
.hito .cuando{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--guia);font-weight:600;margin:0}
.hito .que{margin:3px 0 0;font-size:15.5px}
.hito .dijo{margin:8px 0 0;padding:11px 14px;background:var(--oro-suave);border-radius:12px;
  font-family:var(--serif);font-size:15px;font-style:italic}
.hito .paso-a{margin:9px 0 0;font-size:13.5px;color:var(--gris);display:flex;align-items:flex-start;gap:7px}
.hito .paso-a svg{width:15px;height:15px;flex:none;color:var(--si);margin-top:2px}
.ad{display:flex;gap:8px;align-items:center;margin-top:10px}
.ad .cuadro{flex:1;border-radius:11px;border:2px solid var(--linea);position:relative;background:var(--tarjeta);
  overflow:hidden;padding:10px 10px 22px;font-size:12.5px;color:var(--gris);min-height:52px}
.ad .cuadro span{position:absolute;bottom:0;left:0;right:0;font-size:9.5px;font-weight:600;padding:3px;
  background:var(--linea);color:var(--gris);text-align:center}
.ad .cuadro.nueva{border-color:var(--si)}
.ad .cuadro.nueva span{background:var(--si);color:#fff}
.ad .flecha{color:var(--guia);flex:none}
.reglas{margin-top:26px;border-top:1px solid var(--linea);padding-top:20px}
.reglas h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--guia);font-weight:600;margin:0 0 12px}
.regla-c{background:var(--tarjeta);border:1px solid var(--linea);border-left:4px solid var(--oro);
  border-radius:12px;padding:13px 15px;margin-bottom:10px}
.regla-c p{margin:0;font-size:14.5px}
.regla-c small{display:block;margin-top:5px;color:var(--guia);font-size:12.5px}
.fuente{font-size:11px;color:var(--guia);margin-top:6px;opacity:.8}
a{color:var(--oro)}
button:focus-visible,.vagon:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div class="app">
  <div class="cab">
    <p class="fecha" id="fechaTxt">…</p>

      No — cámbialo
    </button>
    <button class="bSi" id="btnSi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Sí — va
    </button>

<script>
/* ══ sesión — MISMO contrato que la Sala v1: la liga mágica sigue entrando igual ══ */
(function(){
  if(!location.hash) return;
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('gas')) localStorage.setItem('sala_gas',h.get('gas'));
  if(h.get('clave')) localStorage.setItem('sala_clave',h.get('clave'));
  if(h.get('rol')) localStorage.setItem('sala_rol',h.get('rol'));
})();
const GAS=()=>localStorage.getItem('sala_gas')||'';
const CLAVE=()=>localStorage.getItem('sala_clave')||'';
const ROL=()=>localStorage.getItem('sala_rol')||'editor';
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uuid=()=>('xxxxxxxxyxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)}))+Date.now().toString(36);
function leerLS(k,def){ try{ const v=JSON.parse(localStorage.getItem(k)||'null'); return v===null?def:v }catch(e){ return def } }
async function leerJSON(r){ try{ return JSON.parse(await r.text()) }catch(e){ return null } }

/* ══ datos — reintentos + respaldo espejo (las lecciones del 29-ago, portadas) ══ */
async function traer(f,intentos){
  if(GAS()){
    const N=intentos||3;
    for(let i=0;i<N;i++){
      try{
        const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),12000);
        const r=await fetch(GAS()+'?recurso=dia&clave='+encodeURIComponent(CLAVE())+(f?'&f='+encodeURIComponent(f):''),{signal:ctl.signal});
        clearTimeout(t);
        const j=await leerJSON(r);
        if(!r.ok||!j) throw new Error('sin JSON ('+r.status+')');
        if(j.error) throw new Error(j.error);
        return j;
      }catch(e){ if(i<N-1) await new Promise(res=>setTimeout(res,700*(i+1))) }
    }
  }
  const r=await fetch('datos/manifiesto.json?v='+Date.now());
  if(!r.ok) throw new Error('tampoco pude leer el respaldo');
  const j=await r.json(); j._respaldo=true; return j;
}
async function conMarcasDeAntes(d,f){
  if(d._respaldo) return d;
  const M=(d.decisiones&&d.decisiones.propuestas)||{};
  const falta=(d.propuestas||[]).map(p=>p.id).filter(id=>!M[id]);
  if(!falta.length){ d.decisiones={propuestas:M}; return d }
  const dias=(d.dias||[]).filter(x=>x<(d.fecha||f||'9999')).sort().reverse().slice(0,5);
  const set=new Set(falta);
  for(const dd of dias){
    if(!set.size) break;
    try{
      const v=await traer(dd,1);
      const m=(v.decisiones&&v.decisiones.propuestas)||{};
      for(const id of [...set]) if(m[id]){ M[id]=m[id]; set.delete(id) }
    }catch(e){}
  }
  d.decisiones={propuestas:M}; return d;
}
function normalizarDia(j){
  const porId={};
  (j.propuestas||[]).forEach(p=>{
    if(p.opciones&&!Array.isArray(p.opciones)&&p.opciones.candidatas){ p.candidatas=p.opciones.candidatas; p.opciones=[] }
    porId[p.id]=p;
  });
  const fuera=new Set();
  Object.values(porId).forEach(p=>{
    const m=/rehecha-de (\S+)/.exec(p.origen||''); if(m) fuera.add(m[1]);
    if(/^retirada/i.test(p.origen||'')) fuera.add(p.id);
  });
  const M=(j.decisiones&&j.decisiones.propuestas)||{};
  j.propuestas=Object.values(porId).filter(p=>{
    if(fuera.has(p.id)) return false;
    const f=M[p.id];
    if(p.tipo==='eje'){
      const n=(p.opciones||[]).length||0;
      if(!n) return false;                                  // eje vacío = tarjeta de retiro
      if(!f||!f.laminas) return true;
      const m=f.laminas.slice(0,n);
      return !(m.some(x=>x==='si')||m.filter(x=>x==='no').length>=n);
    }
    const n=(p.laminas||[]).length||0;
    if(!n) return false;
    if(!f||!f.laminas) return true;
    let h=0; for(let i=0;i<n;i++) if(f.laminas[i]==='si'||f.laminas[i]==='no') h++;
    return h<n;
  });
  return j;
}

/* ══ estado del turno ══ */
let D=null, fecha='', pasos=[], idx=0, hist=[], dec={};   // dec[pid] = {laminas:[], notas:[], nota:''}
function marcasPrevias(pid){ return ((D.decisiones||{}).propuestas||{})[pid]||null }

function armarPasos(){
  pasos=[]; dec={};
  for(const p of D.propuestas||[]){
    const prev=marcasPrevias(p.id);
    if(p.tipo==='eje'){
      dec[p.id]={laminas:new Array((p.opciones||[]).length).fill(''),notas:new Array((p.opciones||[]).length).fill(''),nota:''};
      pasos.push({tipo:'eje',pid:p.id,p});
    }else{
      const n=(p.laminas||[]).length;
      dec[p.id]={laminas:new Array(n).fill(''),notas:new Array(n).fill(''),nota:''};
      for(let i=0;i<n;i++){
        const ya=prev&&prev.laminas&&(prev.laminas[i]==='si'||prev.laminas[i]==='no');
        if(ya){ dec[p.id].laminas[i]=prev.laminas[i]; continue }   // 🔒 candado: no se repregunta
        pasos.push({tipo:'lamina',pid:p.id,i,p});
      }
    }
  }
}
function pintarBolas(){
  $('#bolas').innerHTML=pasos.map((x,k)=>{
    const m=x.tipo==='lamina'?dec[x.pid].laminas[x.i]:(dec[x.pid]._eje||'');
    return `<span class="bola ${m==='si'?'si':m==='no'?'no':''} ${k===idx&&!m?'hoy':''}"></span>`;
  }).join('');
}
function tituloRestan(){
  const r=pasos.length-idx;
  if(r<=0) return;
  $('#titulo').innerHTML=`Te toca ver <b>${r===1?'1 cosa':r+' cosas'}</b>`;
}
function pintarCartas(){
  const z=$('#zona');
  if(!pasos.length){ pintarVacio(); return }
  if(idx>=pasos.length){ mandar(); return }
  tituloRestan();
  z.innerHTML='';
  for(let k=Math.min(idx+1,pasos.length-1);k>=idx;k--){
    const x=pasos[k], el=document.createElement('div');
    el.className='carta'+(k>idx?' detras':'');
    el.dataset.k=k;
    if(x.tipo==='lamina'){
      el.innerHTML=`<div class="lienzo">
          <span class="sello si" data-si>SÍ</span><span class="sello no" data-no>NO</span>
          <img src="${esc(x.p.laminas[x.i])}" alt="Lámina ${x.i+1}">
        </div>
        <div class="pie"><span class="cual"><b>${esc(x.p.titulo||x.pid)}</b> · lámina ${x.i+1} de ${(x.p.laminas||[]).length}</span></div>`;
    }else{
      const ops=(x.p.opciones||[]).map((o,j)=>`<div class="op">
          <h4>${esc(o.titulo||('Opción '+(j+1)))}</h4><p>${esc(o.texto||'')}</p>
          <button data-op="${j}">Ésta ✓</button></div>`).join('');
      el.innerHTML=`${x.p.video?`<div class="lienzo" style="flex:0 0 40%"><video src="${esc(x.p.video)}" controls playsinline preload="metadata"></video></div>`:''}
        <div class="opciones">${ops}
          <button class="ning" data-ning>Ninguna me late — te dejo nota</button></div>
        <div class="pie"><span class="cual"><b>${esc(x.p.titulo||x.pid)}</b> · elige una</span></div>`;
      el.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{
        dec[x.pid].laminas[+b.dataset.op]='si'; dec[x.pid]._eje='si'; avanzar('si');
      });
      el.querySelector('[data-ning]').onclick=()=>pedirNota(nota=>{
        dec[x.pid].laminas=dec[x.pid].laminas.map(()=>'no'); dec[x.pid].nota=nota; dec[x.pid]._eje='no'; avanzar('no');
      });
    }
    z.appendChild(el);
    if(k===idx&&x.tipo==='lamina') arrastrar(el);
  }
  const esLamina=pasos[idx].tipo==='lamina';
  $('#mando').hidden=!esLamina;
  $('#deshacer').hidden=hist.length===0;
  pintarBolas();
}
function arrastrar(el){
  let x0=null,dx=0;
  const si=el.querySelector('[data-si]'), no=el.querySelector('[data-no]');
  el.addEventListener('pointerdown',e=>{x0=e.clientX;el.style.transition='none'});
  el.addEventListener('pointermove',e=>{
    if(x0===null) return; dx=e.clientX-x0;
    el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;
    si.classList.toggle('ver',dx>55); no.classList.toggle('ver',dx<-55);
  });
  const fin=()=>{
    if(x0===null) return; el.style.transition='';
    if(dx>110){x0=null;decidir('si')}
    else if(dx<-110){x0=null;decidir('no')}
    else{el.style.transform='';si.classList.remove('ver');no.classList.remove('ver')}
    x0=null;dx=0;
  };
  el.addEventListener('pointerup',fin); el.addEventListener('pointercancel',fin);
}
function decidir(m){
  const x=pasos[idx]; if(!x) return;
  if(x.tipo!=='lamina') return;
  if(m==='no'){ pedirNota(nota=>{ dec[x.pid].laminas[x.i]='no'; dec[x.pid].notas[x.i]=nota; avanzar('no') }); return }
  dec[x.pid].laminas[x.i]='si'; avanzar('si');
}
function avanzar(m){
  const el=document.querySelector(`.carta[data-k="${idx}"]`);
  if(el) el.classList.add(m==='si'?'fuera-si':'fuera-no');
  hist.push(idx); pintarBolas();
  setTimeout(()=>{ idx++; pintarCartas() },300);
}
function pedirNota(cb){
  const velo=document.createElement('div'); velo.className='velo';
  velo.innerHTML=`<div class="hoja"><h3>¿Qué le cambio?</h3>
    <p>Con una línea basta. Se vuelve orden de trabajo, no otra pregunta.</p>
    <textarea id="notaT" placeholder="Escribe aquí…"></textarea>
    <div class="rapidas">
      <button data-r="La imagen no cuadra con el texto">La imagen no cuadra</button>
      <button data-r="El texto no engancha">No engancha</button>
      <button data-r="Cambia a la pareja: media alta">Otra pareja</button>
      <button data-r="Más luminosa">Más luminosa</button></div>
    <button class="listo" id="notaOk">Listo, mándalo a rehacer</button></div>`;
  document.body.appendChild(velo);
  const ta=velo.querySelector('#notaT');
  velo.querySelectorAll('.rapidas button').forEach(b=>b.onclick=()=>{ta.value=(ta.value?ta.value+'. ':'')+b.dataset.r;ta.focus()});
  velo.querySelector('#notaOk').onclick=()=>{const n=ta.value.trim();velo.remove();cb(n)};
  velo.addEventListener('click',e=>{if(e.target===velo)velo.remove()});
  setTimeout(()=>ta.focus(),60);
}

/* ══ envío — sobre idéntico al de la Sala v1 (el GAS no cambia) ══ */
function sobre(){
  const envio={accion:'decidir',clave:CLAVE(),fecha,envio_id:uuid(),ts:Date.now(),quien:ROL(),
    nota_general:'',nota_estrategia:'',propuestas:{}};
  for(const p of D.propuestas||[]){
    const d=dec[p.id]; if(!d) continue;
    envio.propuestas[p.id]={nota:d.nota||'',
      laminas:d.laminas.map(m=>m||'pendiente'),
      notas:d.notas.slice(),
      mejoras:d.laminas.map(()=>[])};
  }
  return envio;
}
function encolar(envio){
  const q=leerLS('sala_cola',[]);
  if(!q.some(x=>x.envio_id===envio.envio_id)) q.push(envio);
  localStorage.setItem('sala_cola',JSON.stringify(q));
}
async function subirCola(){
  const q=leerLS('sala_cola',[]); if(!q.length||!GAS()) return;
  q.forEach(e=>{if(!e.clave)e.clave=CLAVE()});
  const resto=[];
  for(const envio of q){
    try{
      const r=await fetch(GAS(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(envio)});
      const j=await leerJSON(r);
      if(!r.ok||!j||j.ok!==true){ if(j&&/no encontr/i.test(String(j.error||''))) continue; throw 0 }
    }catch(e){ resto.push(envio) }
  }
  localStorage.setItem('sala_cola',JSON.stringify(resto));
}
async function mandar(){
  const si=Object.values(dec).flatMap(d=>d.laminas).filter(m=>m==='si').length;
  const no=Object.values(dec).flatMap(d=>d.laminas).filter(m=>m==='no').length;
  const hoyDecidido=hist.length>0;
  $('#mando').hidden=true; $('#deshacer').hidden=true; $('#bolas').innerHTML='';
  $('#titulo').textContent='Guardando…';
  let estado='';
  if(hoyDecidido){
    const envio=sobre();
    try{
      if(!GAS()) throw new Error('sin Sheet');
      const r=await fetch(GAS(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(envio)});
      const j=await leerJSON(r);
      if(!r.ok||!j||j.ok!==true) throw new Error((j&&j.error)||'el Sheet no contestó');
      estado='Guardado en el Sheet a las '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    }catch(e){ encolar(envio); estado='Sin señal — quedó guardada aquí y sube sola.' }
  }
  $('#titulo').textContent='Terminaste';
  $('#zona').innerHTML=`<div class="fin">
    <div class="palomon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h2>Listo, ya está</h2>
    <p>${si} aprobadas quedan con candado.${no?' '+no+' se rehacen con tus notas y te aviso cuando estén.':''}</p>
    <p style="font-size:13px;color:var(--guia)">${esc(estado)}</p>
    <div class="resumen">
      <div class="rbox si"><b>${si}</b><span>aprobadas</span></div>
      <div class="rbox no"><b>${no}</b><span>a rehacer</span></div>
    </div></div>`;
}
function pintarVacio(){
  $('#titulo').textContent='Hoy no hay nada que decidir';
  $('#mando').hidden=true; $('#bolas').innerHTML='';
  $('#zona').innerHTML=`<div class="vacio-hoy">
    <div class="palomon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h2>Todo al día</h2>
    <p>Cuando haya algo nuevo, aparece aquí solito.<br>Abajo puedes pasear por la historia de cada publicación.</p></div>`;
}

/* ══ el tren y los expedientes (reconstruidos con fuentes) ══ */
let EXP={}, METR=null;
async function cargarExpedientes(){
  try{ METR=await (await fetch('datos/metricas.json?v='+Date.now())).json() }catch(e){}
  let idxE=[];
  try{ idxE=await (await fetch('datos/expedientes/index.json?v='+Date.now())).json() }catch(e){}
  for(const it of idxE){
    try{ EXP[it.pieza]=await (await fetch('datos/expedientes/'+it.archivo+'?v='+Date.now())).json() }catch(e){}
  }
  pintarTren();
}
function estCls(e){ return e==='publicada'?'listo':(e==='te espera'?'espera':'') }
function estTxt(e){ return e==='publicada'?'YA SALIÓ':(e==='te espera'?'TE ESPERA':'EN IDEA') }
function miniDe(nombre){
  const m={'La Servilleta':'video/pub2/CORTE_HORMOZI.mp4#t=2',
           '¿Vendo o construyo?':'laminas/vendo-construyo-g2/L3.png',
           'El Apodo del Terreno':'laminas/apodo-g4/L1.png'};
  return m[nombre]||'';
}
function pintarTren(){
  const piezas=Object.entries(EXP);
  if(!piezas.length){ $('#tren').innerHTML='<p class="nota-pie">La historia se está escribiendo…</p>'; return }
  $('#tren').innerHTML=piezas.map(([n,e])=>{
    const src=miniDe(n);
    const img=src&&!src.includes('.mp4')?`<img src="${esc(src)}" alt="" loading="lazy">`:'';
    return `<button class="vagon ${estCls(e.estado)}" data-n="${esc(n)}">
      <span class="mini">${img}${e.estado==='publicada'?'<span class="candado">🔒</span>':''}
        <span class="est">${estTxt(e.estado)}</span></span>
      <span class="nom">${esc(n)}</span></button>`;
  }).join('');
  document.querySelectorAll('.vagon').forEach(v=>v.onclick=()=>abrirExp(v.dataset.n));
}
function abrirExp(nombre){
  const e=EXP[nombre]; if(!e) return;
  const d=document.createElement('div'); d.className='exp';
  const check='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  let resultado=e.resultado;
  if(nombre==='La Servilleta'&&METR&&METR[0]&&METR[0].ig&&!METR[0].ig.error){
    const g=METR[0].ig;
    resultado=[[String(g.views??'–'),'vistas IG'],[String(g.reach??'–'),'alcance'],[String(g.likes??'–'),'me gusta']];
  }
  d.innerHTML=`<div class="exp-in">
    <div class="exp-top">
      <button class="volver" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2>${esc(nombre)}</h2><span class="chip-est ${estCls(e.estado)||'idea'}">${estTxt(e.estado)}</span>
    </div>
    ${resultado?`<div class="result">${resultado.map(r=>`<div><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}</div>`:''}
    ${e.post?`<a class="verpost" href="${esc(e.post)}" target="_blank" rel="noopener">Ver la publicación ↗</a>`:''}
    ${(e.versiones||[]).length?`<div class="carrete">${e.versiones.map(v=>`<div class="ver ${v.viva?'viva':''}">
        <div class="mini2"><span class="tg">${v.viva?'LA BUENA':esc((v.tag||'').toUpperCase())}</span></div>
        <small>${esc(v.fecha||'')}</small></div>`).join('')}</div>`:''}
    <div class="linea-t">${(e.hitos||[]).map(h=>`<div class="hito ${h.quien==='tu'?'tu':'yo'}">
        <p class="cuando">${esc(h.fecha||'')} · ${h.quien==='tu'?'tú decidiste':'se hizo'}</p>
        <p class="que">${esc(h.que||'')}</p>
        ${h.dijo?`<p class="dijo">«${esc(h.dijo)}»</p>`:''}
        ${h.hecho?`<p class="paso-a">${check}<span>${esc(h.hecho)}</span></p>`:''}
        ${h.antes_despues?`<div class="ad">
          <div class="cuadro">${esc(h.antes_despues[0])}<span>ANTES</span></div>
          <span class="flecha">→</span>
          <div class="cuadro nueva">${esc(h.antes_despues[1])}<span>AHORA</span></div></div>`:''}
        ${h.fuente?`<p class="fuente">fuente: ${esc(h.fuente)}</p>`:''}
      </div>`).join('')}</div>
    ${(e.reglas||[]).length?`<div class="reglas"><h3>Reglas que nacieron aquí</h3>
      ${e.reglas.map(r=>`<div class="regla-c"><p><b>${esc(r.regla)}</b></p><small>${esc(r.nacio||'')}</small></div>`).join('')}</div>`:''}
  </div>`;
  document.body.appendChild(d);
  d.querySelector('.volver').onclick=()=>d.remove();
  const escf=ev=>{if(ev.key==='Escape'){d.remove();document.removeEventListener('keydown',escf)}};
  document.addEventListener('keydown',escf);
}

/* ══ arranque: pintado rápido del respaldo + Sheet por atrás ══ */
function pintarFecha(f){
  try{ $('#fechaTxt').textContent=new Date(f+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'}) }
  catch(e){ $('#fechaTxt').textContent=f }
}
let _pintado=false;
function montar(d){
  D=d; fecha=D.fecha||'';
  pintarFecha(fecha);
  armarPasos(); idx=0; hist=[];
  const av=$('#aviso');
  if(D._respaldo){ av.hidden=false; av.textContent='Mostrando el respaldo — buscando el Sheet…' }
  else { av.hidden=true }
  pintarCartas();
}
(async function(){
  cargarExpedientes(); subirCola();
  const rapido=setTimeout(async()=>{
    try{
      const r=await fetch('datos/manifiesto.json?v='+Date.now());
      if(!r.ok) return;
      const j=await r.json(); j._respaldo=true;
      if(!_pintado){ montar(normalizarDia(j)) }
    }catch(e){}
  },2500);
  try{
    const d=normalizarDia(await conMarcasDeAntes(await traer(),''));
    clearTimeout(rapido); _pintado=true; montar(d);
  }catch(e){
    clearTimeout(rapido);
    if(!_pintado){
      try{
        const r=await fetch('datos/manifiesto.json?v='+Date.now());
        const j=await r.json(); j._respaldo=true; _pintado=true; montar(normalizarDia(j));
      }catch(e2){
        $('#titulo').textContent='No pude alcanzar la sala';
        const av=$('#aviso'); av.hidden=false; av.className='aviso malo';
        av.textContent='Puede ser la red. Recarga en un momento — tu trabajo no se pierde.';
      }
    }
  }
})();
$('#btnSi').onclick=()=>decidir('si');
$('#btnNo').onclick=()=>decidir('no');
$('#deshacer').onclick=()=>{ if(!hist.length) return; idx=hist.pop();
  const x=pasos[idx]; if(x.tipo==='lamina'){ dec[x.pid].laminas[x.i]=''; dec[x.pid].notas[x.i]='' }
  else { dec[x.pid].laminas=dec[x.pid].laminas.map(()=>''); dec[x.pid]._eje='' }
  pintarCartas() };
document.addEventListener('keydown',e=>{
  if(document.querySelector('.velo,.exp')) return;
  if(e.key==='ArrowRight') decidir('si');
  if(e.key==='ArrowLeft') decidir('no');
});
window.addEventListener('online',subirCola);
</script>
