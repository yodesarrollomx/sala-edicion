name: Sala publicada · cuatro recorridos visuales completos
on:
  push:
    branches: [codex/sala-evidencia-real-20261017]
    paths-ignore: ['evidencia-mesa/**']
permissions:
  contents: write
jobs:
  evidencia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node operaciones/verificar-mesa-publicada.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-mesa-publicada
          path: evidencia-mesa/
      - name: Conservar capturas públicas y bitácora
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidencia-mesa/
          if ! git diff --cached --quiet; then
            git commit -m "Conservar recorrido real de Mesa publicado"
            git push
          fi
