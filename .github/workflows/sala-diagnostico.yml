name: Diagnosticar instalación de Sala
on:
  push:
    branches: [codex/sala-transporte-20261010]
    paths: ['nube/diagnosticar_instalacion.py', 'nube/sala_cliente.py', 'nube/sala_catalogo.py', 'tests/sala_catalogo_test.py', 'tests/sala_transporte_test.py', '.github/workflows/sala-diagnostico.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  leer:
    if: github.repository == 'yodesarrollomx/sala-edicion' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            nube
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar transporte con un servidor local sintético
        run: |
          python3 -m unittest discover -s tests -p sala_transporte_test.py -v
          python3 -m unittest discover -s tests -p sala_catalogo_test.py -v
      - name: Leer catálogo y día, sin decisiones ni producción
        env:
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
          YOD_APP_ID: ${{ vars.YOD_PUBLISHER_APP_ID }}
          YOD_APP_KEY: ${{ secrets.YOD_PUBLISHER_APP_PRIVATE_KEY }}
        run: python3 nube/diagnosticar_instalacion.py
