name: Sala · chinches y auditoría de modelos
on:
  push:
    branches: [codex/sala-veto-modelo-control-20261012]
    paths: [.github/workflows/sala-veto-control.yml]
permissions:
  contents: read
  actions: write
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1b555ccad93b66fbc21432f7294061defc681a90
          persist-credentials: false
      - run: pip install --quiet requests
      - name: Ejecutar Chinches solicitado por Dirección
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sala-chinches.yml --ref main -f simular=false
      - name: Leer último snapshot privado
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 nube/snapshots_online.py bootstrap
      - name: Relacionar decisiones actuales con motores sin publicar notas
        env:
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
          PYTHONPATH: nube
        run: |
          python3 - <<'PY'
          import base64,collections,json,urllib.request
          import sala_cliente as sala
          from sala_produccion import cargar,leer_tira
          from motores._comun import toma_elegida
          ctx=cargar();decs=ctx["decisiones"]["propuestas"];props={p["id"]:p for p in ctx["propuestas"]}
          stats=collections.defaultdict(lambda:{"aprobadas":0,"rechazos_exclusivos":0,"rechazos_compartidos":0})
          by_slot=[];unassigned=0;missing=0
          for pid,d in decs.items():
              t=leer_tira(pid)
              if not t: missing+=1;continue
              mapa=t.get("mapa") or {str(i+1):v for i,v in enumerate(t.get("decidir",[]))}
              lams={str(l["n"]):l for l in t.get("laminas",[])}
              notes=d.get("notas") or d.get("notas_laminas") or []
              for i,m in enumerate(d.get("laminas",[])):
                  if m not in ("si","no"):continue
                  l=lams.get(str(mapa.get(str(i+1),i+1)))
                  if not l:continue
                  cs=l.get("candidatas") or [];engines=sorted({c.get("motor") or "sin_procedencia" for c in cs})
                  note=str(notes[i] or "") if i<len(notes) else ""
                  selected=toma_elegida(note or d.get("nota") or "")
                  if m=="si" and 0<selected<=len(cs): stats[cs[selected-1].get("motor") or "sin_procedencia"]["aprobadas"]+=1
                  elif m=="no":
                      for e in engines: stats[e]["rechazos_exclusivos" if len(engines)==1 else "rechazos_compartidos"]+=1
                      if not engines:unassigned+=1
                  if pid=="tu-terreno-tus-reglas-nube-2026-10-11-37000b":
                      by_slot.append({"indice":i,"n":l["n"],"marca":m,"motores":engines,
                                      "seleccion":selected if selected else None})
          print("MODELOS_META "+json.dumps({"fecha":ctx["fecha"],"motores":dict(stats),
              "sin_procedencia":unassigned,"fuentes_sin_tira":missing,"foco":by_slot}))
          focus=leer_tira("tu-terreno-tus-reglas-nube-2026-10-11-37000b")
          if focus:
              mapa=focus.get("mapa") or {}
              real=mapa.get("4",4)
              lam=next((l for l in focus["laminas"] if str(l["n"])==str(real)),None)
              if lam:
                  for c in lam.get("candidatas",[]):
                      print("FOCO_META "+json.dumps({"n":lam["n"],"motor":c.get("motor"),
                            "cerebro":c.get("cerebro"),"titulo":c.get("titulo")}))
                      src=c.get("src")
                      if src and src.startswith("laminas/") and ".." not in src.split("/"):
                          with urllib.request.urlopen("https://yodesarrollomx.github.io/sala-edicion/"+src,timeout=30) as r: raw=r.read()
                          print("FOTO_BASE64 "+base64.b64encode(raw).decode())
          PY
