name: Sala · comprobar retiro publicado
on:
  push:
    branches: [codex/sala-veto-modelo-control-20261012]
    paths: [.github/workflows/sala-veto-control.yml]
permissions:
  contents: read
  actions: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02b06521575ea6b938a7af7350dcae9bb6ea54ab
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet requests
      - name: Confirmar cumplimiento en Chinches
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sala-chinches.yml --ref main -f simular=false
      - name: Comprobar publicación y proyección real de la siguiente revisión
        env:
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
          PYTHONPATH: nube
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,re,subprocess,time,urllib.request
          import sala_cliente as sala
          from sala_produccion import cargar,resolver_tira
          sala.enmascarar_en_actions()
          base="https://yodesarrollomx.github.io/sala-edicion/"
          def get(path):
              req=urllib.request.Request(base+path,headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=30) as r: return r.read()
          expected=pathlib.Path("politica-imagen.js").read_bytes()
          expected_html=pathlib.Path("index.html").read_text()
          seal=re.search("const SELLO_SALA='([^']+)'",expected_html).group(1)
          end=time.time()+900
          while time.time()<end:
              try:
                  actual=get("politica-imagen.js")
                  html=get("index.html").decode()
                  if actual==expected and ("const SELLO_SALA='"+seal+"'") in html:break
              except Exception:pass
              time.sleep(10)
          else:raise SystemExit("Veto no publicado con versión exacta")
          print("POLITICA_PUBLICA_META "+json.dumps({"code_sha":"02b06521575ea6b938a7af7350dcae9bb6ea54ab",
              "sha256":hashlib.sha256(actual).hexdigest(),"sello":seal,"confirmada":True}))
          def tira(pid):
              if not re.fullmatch("[A-Za-z0-9_.-]+",pid):raise ValueError("id inválido")
              try:return json.loads(get("datos/tiras/"+pid+".json"))
              except Exception:return None
          ctx=cargar(tira_reader=tira)
          entries=[];missing=0
          for p in ctx["propuestas"]:
              if not p.get("laminas"):continue
              t=tira(p["id"])
              if not t:missing+=1;continue
              d=ctx["decisiones"]["propuestas"].get(p["id"],{})
              resolved=resolver_tira(t,d,p)
              for l in resolved.get("laminas",[]):
                  if l.get("estado")=="aprobada":continue
                  entries.append({"estado":l.get("estado"),"src":l.get("src"),
                                  "candidatas":[{k:c.get(k) for k in ("src","original","motor","modelo")}
                                                for c in l.get("candidatas",[])]})
          code="""const p=require('./politica-imagen.js');
          let raw='';process.stdin.on('data',c=>raw+=c);process.stdin.on('end',()=>{
           const rows=JSON.parse(raw);let before=0,after=0,wait=0,ok=0;
           for(const l of rows){before+=l.candidatas.filter(p.vetada).length;
            const cs=p.tomas(l);after+=cs.filter(p.vetada).length;
            const src=p.srcLamina(l,l.src);
            if(!src)wait++;else ok++;
            if(l.candidatas.some(c=>p.vetada(c)&&(c.src===src||c.original===src)))throw Error('Foto vetada ofrecida');
           }
           console.log('VISTA_META '+JSON.stringify({laminas_pendientes:rows.length,
             candidatas_retiradas:before,candidatas_vetadas_visibles:after,
             con_toma_permitida:ok,en_espera:wait,escrituras_decisiones:0}));
          });"""
          subprocess.run(["node","-e",code],input=json.dumps(entries),text=True,check=True)
          print("LECTURA_META "+json.dumps({"fecha":ctx["fecha"],"tarjetas_sin_tira":missing}))
          PY
