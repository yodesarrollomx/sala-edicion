name: Confirmar Sala publicada y configuración HiDream
on:
  push:
    branches: [codex/sala-tablero-evidencia-20261013]
    paths: ['.github/workflows/sala-tablero-en-linea.yml']
permissions:
  contents: write
  actions: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 8be2246fcba8c300affad2a12f5d5c8e1e9acb26
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            operaciones
      - uses: actions/checkout@v4
        with:
          ref: 8be2246fcba8c300affad2a12f5d5c8e1e9acb26
          path: _codigo-temporal
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests google-auth pillow
      - name: Leer configuración, confirmar bytes de Pages y simular Mesa
        env:
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
        run: python3 operaciones/tablero-20261013/en-linea.py
      - name: Guardar sólo recibo agregado, sin datos privados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operaciones/tablero-20261013/publicacion.json
          git commit -m 'Confirmar publicación del tablero, configuración y simulación sin votos'
          git push origin HEAD:codex/sala-tablero-evidencia-20261013
