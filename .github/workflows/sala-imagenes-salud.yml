name: Sala · diagnóstico sintético de proveedores de imagen
on:
  push:
    branches: [codex/sala-modelos-vigentes-20261012]
    paths: [.github/workflows/sala-imagenes-salud.yml]
permissions:
  contents: read
jobs:
  proveedores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Medir disponibilidad sin datos de negocio
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import base64,json,os,time,urllib.request,urllib.error
          out=[]
          def req(label,url,data=None,headers=None,timeout=25):
              start=time.monotonic()
              try:
                  raw=None if data is None else json.dumps(data).encode()
                  h={"Content-Type":"application/json",**(headers or {})}
                  with urllib.request.urlopen(urllib.request.Request(url,data=raw,headers=h),timeout=timeout) as r:
                      body=r.read();ctype=r.headers.get("Content-Type","")
                  row={"proveedor":label,"http":200,"segundos":round(time.monotonic()-start,2),"bytes":len(body)}
                  out.append(row);return row,body,ctype
              except urllib.error.HTTPError as e:
                  row={"proveedor":label,"http":e.code,"segundos":round(time.monotonic()-start,2),"imagen_verificada":False}
                  out.append(row);return row,None,None
              except Exception as e:
                  row={"proveedor":label,"tipo_error":type(e).__name__,"segundos":round(time.monotonic()-start,2),"imagen_verificada":False}
                  out.append(row);return row,None,None
          prompt="A simple gray cube centered on a clean white background. No text or letters."
          key=os.environ.get("GEMINI_API_KEY")
          if key:
              for model in ["gemini-3.1-flash-lite-image","gemini-3.1-flash-image"]:
                  row,body,typ=req(model,"https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+key,
                      {"contents":[{"parts":[{"text":prompt}]}],"generationConfig":{"responseModalities":["IMAGE","TEXT"]}})
                  if body:
                      try:
                          parts=json.loads(body).get("candidates",[{}])[0].get("content",{}).get("parts",[])
                          raws=[base64.b64decode((p.get("inlineData") or p.get("inline_data") or {}).get("data") or "") for p in parts]
                          row["imagen_verificada"]=any(len(r)>1024 and (r.startswith(b"\xff\xd8") or r.startswith(b"\x89PNG")) for r in raws)
                      except Exception: row["imagen_verificada"]=False
                  if row.get("imagen_verificada"): break
          else: out.append({"proveedor":"gemini","configurado":False})
          print("PROVEEDORES_META "+json.dumps({"pruebas":out,"escrituras_negocio":0,"prompts_sinteticos":True}))
          PY
