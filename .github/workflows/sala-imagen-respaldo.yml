name: Sala · comprobar respaldo editorial y latencia
on:
  push:
    branches: [codex/sala-modelos-vigentes-20261012]
    paths: [.github/workflows/sala-imagen-respaldo.yml]
permissions:
  contents: read
jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install --quiet pillow
      - name: Probar la foto y dos tamaños sin escribir registros
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,json,time,urllib.request,urllib.parse,urllib.error
          from PIL import Image
          out=[]
          prompt="Photorealistic editorial photograph of a family and a professional architect around a table with large blueprints in a sunlit modern home in Hermosillo, Mexico. Warm natural light, realistic faces and hands. No text, no captions, no signs, no logos."
          for w,h in [(720,960),(1080,1440)]:
              start=time.monotonic()
              url="https://image.pollinations.ai/prompt/"+urllib.parse.quote(prompt)+"?"+urllib.parse.urlencode(
                  {"width":w,"height":h,"model":"flux","nologo":"true","private":"true","seed":int(time.time())})
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"sala-yod"}),timeout=25) as r:
                      raw=r.read();typ=r.headers.get("Content-Type","")
                  im=Image.open(io.BytesIO(raw));im.verify()
                  out.append({"proveedor":"pollinations","pedido":[w,h],"imagen_verificada":"image" in typ and len(raw)>5000,
                              "bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),
                              "segundos":round(time.monotonic()-start,2)})
                  if w==720: print("FOTO_BASE64 "+base64.b64encode(raw).decode())
              except Exception as e:
                  out.append({"proveedor":"pollinations","pedido":[w,h],"imagen_verificada":False,
                              "tipo_error":type(e).__name__,"http":getattr(e,"code",None),
                              "segundos":round(time.monotonic()-start,2)})
          print("RESPALDO_META "+json.dumps({"pruebas":out,"escrituras_negocio":0,"prompts_sinteticos":True}))
          PY
