# El semillero y el arranque (23-sep, chinches #20 y #21): lo que la ronda /sala hacía en la Mac.
# Cada mañana: 3 ideas nuevas por rama viva (+1 premisa candidata) y, a cada idea que él eligió en
# el Árbol y no tiene tira, su guion y su primera lámina con tomas → a su mesa de Hoy.
name: Semillero y arranque de la Sala

on:
  # El horario vive en sala-diario.yml / sala-cada-hora.yml (25-sep-2026): aquí solo se llama.
  workflow_call:
    inputs:
      modo:
        type: string
        default: todo
  workflow_dispatch:
    inputs:
      modo:
        description: 'simular = sólo decir; ideas = sólo el semillero; arrancar = sólo el arranque; todo = las dos'
        type: choice
        options: [simular, ideas, arrancar, todo]
        default: simular

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: sala-mesa        # comparte candado con el montador: nunca dos escribiendo tiras a la vez
  cancel-in-progress: false

jobs:
  arranque:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      MODO: ${{ inputs.modo || 'todo' }}
      SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
      SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Librerías (imagen y HTTP)
        run: pip install --quiet pillow requests

      - name: Caché de la tipografía de la casa (Playfair Display, OFL)
        id: cache-fuentes
        uses: actions/cache@v4
        with:
          path: nube/.cache/fuentes
          key: playfair-v1

      - name: Bajar la tipografía si no está en caché
        if: steps.cache-fuentes.outputs.cache-hit != 'true'
        run: |
          mkdir -p nube/.cache/fuentes
          base=https://github.com/google/fonts/raw/main/ofl/playfairdisplay
          curl -fsSL -o 'nube/.cache/fuentes/PlayfairDisplay[wght].ttf' "$base/PlayfairDisplay%5Bwght%5D.ttf"
          curl -fsSL -o 'nube/.cache/fuentes/PlayfairDisplay-Italic[wght].ttf' "$base/PlayfairDisplay-Italic%5Bwght%5D.ttf"

      - name: Semillero y arranque
        id: arr
        working-directory: nube
        run: |
          set +e
          case "$MODO" in
            simular)  f="--ideas --arrancar --simular" ;;
            ideas)    f="--ideas" ;;
            arrancar) f="--arrancar" ;;
            *)        f="--ideas --arrancar" ;;
          esac
          python3 sala_arranque.py $f 2>&1 | tee ../arranque.log
          echo "codigo=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Verificar antes de publicar
        if: steps.arr.outputs.codigo == '0' && env.MODO != 'simular' && env.MODO != 'ideas'
        run: |
          pip install --quiet google-auth
          python3 nube/verificar.py

      - name: Guardar mediante PR y checks obligatorios
        id: guardar
        if: steps.arr.outputs.codigo == '0' && env.MODO != 'simular' && env.MODO != 'ideas'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 nube/publicar_git.py integrar --proceso arranque

      - name: Publicar el commit integrado y esperar su corrida exacta
        if: steps.guardar.outputs.hubo == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.guardar.outputs.merge_sha }}
        run: python3 nube/publicar_git.py publicar --proceso arranque --sha "$MERGE_SHA"

      - name: Montar en la mesa
        if: steps.guardar.outputs.hubo == 'si'
        working-directory: nube
        run: python3 sala_arranque.py --montar 2>&1 | tee -a ../arranque.log

      - name: Avisar si algo falló
        if: failure() || steps.arr.outputs.codigo != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}      # sólo para tacharlos del log (limpiar_log.py)
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
        run: |
          titulo="🔎 Vigía · Sala de Edición"
          numero=$(gh issue list --search "in:title \"$titulo\"" --state open \
                   --json number,title --jq ".[] | select(.title==\"$titulo\") | .number" | head -n1)
          [ -z "$numero" ] && exit 0
          { echo "## 🔴 El semillero/arranque falló — $(date -u '+%Y-%m-%d %H:%M UTC')"; echo;
            echo '```'; python3 nube/limpiar_log.py arranque.log 40; echo '```'; } > comentario.md
          gh issue comment "$numero" --body-file comentario.md
          exit 1
