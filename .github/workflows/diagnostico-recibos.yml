name: Diagnostico privado de recibos de imagen
on:
  push:
    branches: [codex/diagnostico-recibos-20261017]
permissions:
  contents: write
jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            nube
            politica-imagen.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests pillow gradio_client
      - name: Inspeccionar estados sin generar ni modificar registros
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 nube/diagnostico_recibos_actual.py
      - name: Conservar muestra verificable de la receta real
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'codex'
          git config user.email 'codex@users.noreply.github.com'
          git add --sparse evidencia-hidream-o1
          git commit -m 'evidencia: prueba real de reemplazo HiDream O1, no aprobacion'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:codex/diagnostico-recibos-20261017
