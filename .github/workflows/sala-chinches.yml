# El puente de las chinches (23-sep): lo que se clava con la 📌 en la Sala va al Sheet
# (PRODUCCION · «ENCARGO · chinche»). Antes lo cosechaba la Mac; desde la mudanza a la nube se
# quedaba ahí. Esto lo convierte en issue 📌 (que trabaja el revisor de chinches), y cuando el issue
# se cierra apunta «ENCARGO CUMPLIDO» en el Sheet y reescribe datos/encargos.json.
name: Puente de chinches de la Sala

on:
  # El horario vive en sala-diario.yml / sala-cada-hora.yml (25-sep-2026): aquí solo se llama.
  workflow_call:
  workflow_dispatch:
    inputs:
      simular:
        description: 'Sólo decir qué haría'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: sala-chinches
  cancel-in-progress: false

jobs:
  puente:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Chinches del Sheet → issues, y cerradas → CUMPLIDO
        working-directory: nube
        env:
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
          GH_TOKEN: ${{ github.token }}
        run: python3 sala_chinches.py ${{ inputs.simular && '--simular' || '' }}

      - name: Despertar al Ejecutor si hay trabajo en fila
        id: despertador
        if: ${{ !inputs.simular }}
        working-directory: nube
        env:
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
        run: python3 sala_despertar.py

      - name: Encender al Ejecutor
        if: steps.despertador.outputs.despertar == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # si ya hay uno corriendo o en espera, no se apila otro (el candado del Ejecutor los formaría igual)
          vivos=$(gh run list --workflow sala-ejecutor.yml --limit 5 --json status --jq '[.[]|select(.status!="completed")]|length')
          if [ "$vivos" != "0" ]; then echo "ya hay $vivos corrida(s) del Ejecutor en curso"; exit 0; fi
          gh workflow run sala-ejecutor.yml --ref main && echo "Ejecutor encendido"

      - name: Verificar antes de publicar (las reglas del repo)
        if: ${{ !inputs.simular }}
        run: |
          pip install --quiet google-auth requests
          python3 nube/verificar.py

      - name: Guardar mediante PR y checks obligatorios
        id: guardar
        if: ${{ !inputs.simular }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 nube/publicar_git.py integrar --proceso chinches

      - name: Publicar el commit integrado y esperar su corrida exacta
        if: steps.guardar.outputs.hubo == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.guardar.outputs.merge_sha }}
        run: python3 nube/publicar_git.py publicar --proceso chinches --sha "$MERGE_SHA"
