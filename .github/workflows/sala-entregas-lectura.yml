name: Sala · comprobar entregas públicas
on:
  push:
    branches: [codex/sala-modelos-vigentes-20261012]
    paths: [.github/workflows/sala-entregas-lectura.yml]
permissions:
  contents: read
jobs:
  entregas:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Comprobar cierre del guion y conservación de tomas
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.request, urllib.error
          base="https://yodesarrollomx.github.io/sala-edicion/"
          targets={
            "doble-via":"doble-via-nube-2026-10-11-5109dd",
            "la-identidad-no-se-improvisa":"la-identidad-no-se-improvisa-nube-2026-10-11-b5db77",
            "llamada-que-pasa":"llamada-que-pasa-nube-2026-10-11-11c518",
            "mesa-vacia":"mesa-vacia-nube-2026-10-11-22107b"}
          previous="la-ruta-autonoma-nube-2026-10-11-0cab8c"
          def get(path):
              req=urllib.request.Request(base+path,headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=30) as r: return r.read()
          def read(pid): return json.loads(get("datos/tiras/"+pid+".json"))
          old=read(previous)
          end=time.time()+900
          final=None
          while time.time()<end:
              try:
                  ids=json.loads(get("datos/tiras/index.json"))
                  for pid in ids:
                      if not pid.startswith("la-ruta-autonoma-nube-2026-10-11-"): continue
                      t=read(pid)
                      if (t.get("base")==previous and len(t.get("laminas",[]))==6
                          and len(t.get("guion",[]))==6 and t.get("decidir")==[2,3,4,5,6]):
                          final=(pid,t);break
                  if final: break
              except (OSError,ValueError,urllib.error.URLError): pass
              time.sleep(20)
          if not final: raise SystemExit("No hay tira completa comprobada")
          pid,t=final
          old_l={str(l["n"]):l for l in old["laminas"]}
          new_l={str(l["n"]):l for l in t["laminas"]}
          def fingerprint(l):
              return {"src":l.get("src"),"dice":l.get("dice"),
                      "candidatas":[{"src":c.get("src"),"original":c.get("original"),
                                     "dice":c.get("dice")} for c in l.get("candidatas",[])]}
          assert new_l["1"].get("estado")=="aprobada"
          for number in ["1","2","3","4"]:
              assert fingerprint(new_l[number])==fingerprint(old_l[number]),"Cambió una toma conservada"
          assert new_l["1"]["src"]=="laminas/la-ruta-autonoma-n2026-10-07/L1-1.png"
          assert all(new_l[str(n)].get("estado")!="aprobada" for n in range(2,7))
          targets["la-ruta-autonoma"]=pid
          metas=[]
          hashes=[]
          for slug,p in targets.items():
              tira=read(p)
              metas.append({"slug":slug,"id":p,"laminas":len(tira["laminas"]),
                            "guion":len(tira.get("guion",[])),"decidir":tira.get("decidir",[])})
              for number in tira.get("decidir",[]):
                  lam=next(l for l in tira["laminas"] if l["n"]==number)
                  for c in lam.get("candidatas",[]):
                      path=c["src"]
                      assert path.startswith("laminas/") and ".." not in path.split("/")
                      raw=get(path)
                      assert len(raw)>1024 and (raw.startswith(b"\xff\xd8") or raw.startswith(b"\x89PNG"))
                      hashes.append({"slug":slug,"n":number,"bytes":len(raw),
                                     "sha256":hashlib.sha256(raw).hexdigest()})
          print("CIERRE_META "+json.dumps({"encontradas":len(metas),"tiras":metas,
              "toma_aprobada_conservada":True,"candidatas_anteriores_conservadas":3,
              "escrituras_negocio":0}))
          print("MEDIOS_META "+json.dumps(hashes))
          PY
