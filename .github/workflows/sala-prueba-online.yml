name: Prueba técnica Sala online
on:
  push:
    branches: [codex/sala-online-20261011]
    paths:
      - nube/imagen_cpu_requirements.txt
      - nube/motores/imagen_cpu.py
      - nube/prueba_online.py
      - .github/workflows/sala-prueba-online.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sala-prueba-online
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name != 'pull_request'
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TORCH_FORCE_WEIGHTS_ONLY_LOAD: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU y codecs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          pip install --quiet torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r nube/imagen_cpu_requirements.txt
          pip install --quiet google-auth requests pillow numpy kokoro-onnx opencv-python-headless onnxruntime
      - name: Caché de pesos públicos
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            nube/.cache/kokoro
            nube/.cache/depth
          key: sala-cpu-tiny-sd-cad0bd7-kokoro-depth-v1
      - name: Pesos oficiales de voz
        run: |
          mkdir -p nube/.cache/kokoro
          test -f nube/.cache/kokoro/kokoro-v1.0.onnx || curl -fsSL -o nube/.cache/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          test -f nube/.cache/kokoro/voices-v1.0.bin || curl -fsSL -o nube/.cache/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Producir, montar y confirmar bytes en carpeta privada
        working-directory: nube
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: python3 prueba_online.py
