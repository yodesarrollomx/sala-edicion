name: Sala · rastrear imagen y comprobar nuevos modelos
on:
  push:
    branches: [codex/sala-rastrear-rehacer-imagenes-20261012]
    paths: [.github/workflows/sala-rastreo-imagen.yml]
permissions:
  contents: read
jobs:
  origen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02b06521575ea6b938a7af7350dcae9bb6ea54ab
          persist-credentials: false
      - run: pip install --quiet requests pillow
      - name: Rastrear captura y modelos en cartas activas sin escribir decisiones
        env:
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
          PYTHONPATH: nube
        run: |
          python3 - <<'PY'
          import base64,collections,io,json,re,unicodedata,urllib.request
          from PIL import Image
          import sala_cliente as sala
          from sala_produccion import cargar,resolver_tira
          sala.enmascarar_en_actions()
          base="https://yodesarrollomx.github.io/sala-edicion/"
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={"Cache-Control":"no-cache"}),timeout=30) as r:return r.read()
          def tira(pid):
              if not re.fullmatch("[A-Za-z0-9_.-]+",pid):raise ValueError("id inválido")
              return json.loads(get("datos/tiras/"+pid+".json"))
          ctx=cargar(tira_reader=tira)
          print("LECTURA_META "+json.dumps({"fecha":ctx["fecha"],"cartas":len(ctx["propuestas"])}))
          target="El tío sugiere locales, la vecina prefiere departamentos y cada familia aporta una idea distinta."
          def norm(s):return " ".join(unicodedata.normalize("NFKD",str(s)).lower().split())
          counts=collections.Counter();matches=0
          for p in ctx["propuestas"]:
              if not p.get("laminas"):continue
              t=tira(p["id"]);d=ctx["decisiones"]["propuestas"].get(p["id"],{})
              r=resolver_tira(t,d,p)
              for l in r.get("laminas",[]):
                  cs=l.get("candidatas") or []
                  source=l.get("src")
                  c=next((c for c in cs if source in (c.get("src"),c.get("original"))),{})
                  counts[(str(c.get("motor") or l.get("motor") or "sin metadato"),str(l.get("estado")))]+=1
                  strings=[l.get("dice"),l.get("texto"),l.get("caption"),l.get("frase"),*[(x.get("texto") or "") for x in cs]]
                  if not any(norm(target) in norm(s) or "la vecina prefiere departamentos" in str(s).lower() for s in strings):continue
                  matches+=1
                  print("CAPTURA_ORIGEN "+json.dumps({"prop_id":p["id"],"titulo":p.get("titulo"),"n":l.get("n"),"estado":l.get("estado"),"src":source,"texto":l.get("dice") or l.get("texto"),"candidatas":[{k:c.get(k) for k in ("motor","modelo","src","original","huella","texto")} for c in cs],"meta_tira":{k:t.get(k) for k in ("fecha","pieza_slug","revision","origen","producida_por","run_id")}},ensure_ascii=False))
                  for path in [source,c.get("original")]:
                      if not path or not path.startswith("laminas/"):continue
                      img=Image.open(io.BytesIO(get(path))).convert("RGB");img.thumbnail((480,640));out=io.BytesIO();img.save(out,"JPEG",quality=85)
                      print("FOTO_BASE64 "+base64.b64encode(out.getvalue()).decode())
          print("MODELOS_ACTIVOS "+json.dumps([{"motor":k[0],"estado":k[1],"laminas":v} for k,v in counts.items()]))
          print("CAPTURA_COINCIDENCIAS "+str(matches))
          if not matches:raise SystemExit("Texto de captura sin coincidencia; ampliar al guion público")
          PY
  modelo_flux2:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02b06521575ea6b938a7af7350dcae9bb6ea54ab
          persist-credentials: false
      - run: pip install --quiet requests pillow
      - name: Verificar contrato multipart de FLUX 2 y cuota real
        env:
          PYTHONPATH: nube
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64,io,json,os,requests
          from PIL import Image
          import sala_cliente as sala
          sala.enmascarar_en_actions()
          prompt="Professional architectural editorial photograph, vertical 4:5. A Mexican family of four and an architect seated around a large dining table discussing three miniature architectural models: a storefront, a low-rise apartment building and a house. Blank site plan and wooden rulers on the table. Distinct realistic faces, natural hands and accurate geometry. Candid documentary moment, elegant contemporary beige interior, warm window daylight, crisp high-resolution detail, full-frame camera 35mm lens. No text, letters, logos or watermark."
          model="@cf/black-forest-labs/flux-2-klein-9b"
          url="https://api.cloudflare.com/client/v4/accounts/"+os.environ["CF_ACCOUNT_ID"]+"/ai/run/"+model
          r=requests.post(url,headers={"Authorization":"Bearer "+os.environ["CF_API_TOKEN"]},files={k:(None,str(v)) for k,v in {"prompt":prompt,"width":1024,"height":1280,"steps":8}.items()},timeout=180)
          if r.status_code!=200:
              print("MODELO_RESULTADO "+json.dumps({"modelo":model,"ok":False,"status":r.status_code,"error":sala.redactar(r.text)[:350]}))
          else:
              ct=r.headers.get("Content-Type","")
              raw=base64.b64decode(r.json()["result"]["image"]) if "json" in ct else r.content
              im=Image.open(io.BytesIO(raw)).convert("RGB");dim=im.size;im.thumbnail((600,750));out=io.BytesIO();im.save(out,"JPEG",quality=90)
              print("MODELO_RESULTADO "+json.dumps({"modelo":model,"ok":True,"dimensiones":dim,"bytes":len(raw)}))
              print("FOTO_BASE64 "+base64.b64encode(out.getvalue()).decode())
          PY
