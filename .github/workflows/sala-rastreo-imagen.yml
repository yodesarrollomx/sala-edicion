name: Sala · verificar retiro y reemisión publicados
on:
  push:
    branches: [codex/sala-rastrear-rehacer-imagenes-20261012]
    paths: [.github/workflows/sala-rastreo-imagen.yml]
permissions:
  contents: read
  actions: write
jobs:
  publicacion:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 94ecdf77d4c6a3bba7ffd9ce82587c6100fc2e64
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --quiet requests pillow
      - name: Verificar script exacto y las fuentes reales en todos los puntos de revisión
        env:
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
          PYTHONPATH: nube
        run: |
          python3 - <<'PY'
          import collections,hashlib,json,pathlib,re,subprocess,time,urllib.request
          import sala_cliente as sala
          from sala_produccion import cargar,resolver_tira
          from motores.politica_imagen import fuente_retirada
          sala.enmascarar_en_actions()
          base="https://yodesarrollomx.github.io/sala-edicion/"
          def get(path):
              req=urllib.request.Request(base+path,headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=30) as r:return r.read()
          expected=pathlib.Path("politica-imagen.js").read_bytes()
          seal=re.search("const SELLO_SALA='([^']+)'",pathlib.Path("index.html").read_text()).group(1)
          end=time.time()+600
          while time.time()<end:
              try:
                  actual=get("politica-imagen.js")
                  html=get("index.html").decode()
                  if actual==expected and ("const SELLO_SALA='"+seal+"'") in html:break
              except Exception:pass
              time.sleep(10)
          else:raise SystemExit("Versión exacta todavía no publicada")
          print("POLITICA_PUBLICA_META "+json.dumps({"code_sha":"94ecdf77d4c6a3bba7ffd9ce82587c6100fc2e64","sha256":hashlib.sha256(actual).hexdigest(),"sello":seal,"confirmada":True}))
          def tira(pid):
              if not re.fullmatch("[A-Za-z0-9_.-]+",pid):raise ValueError("id inválido")
              return json.loads(get("datos/tiras/"+pid+".json"))
          ctx=cargar(tira_reader=tira)
          raw=[];ready=[];pending=[]
          for prop in ctx["propuestas"]:
              if not prop.get("laminas"):continue
              t=tira(prop["id"]);d=ctx["decisiones"]["propuestas"].get(prop["id"],{})
              resolved=resolver_tira(t,d,prop)
              for l in t.get("laminas",[]):raw.append({"estado":l.get("estado"),"src":l.get("src"),"candidatas":[{k:c.get(k) for k in ("motor","modelo","src","original")} for c in l.get("candidatas",[])]})
              for l in resolved.get("laminas",[]):
                  if l.get("reemplazo_modelo"):pending.append({"prop_id":prop["id"],"n":l.get("n"),"motivo":"modelo_retirado"})
                  if l.get("estado")=="aprobada":ready.append(l.get("src"))
          assert not any(fuente_retirada(s) for s in ready),"Fuente retirada aún elegible para producción"
          js="""const p=require('./politica-imagen.js');let raw='';process.stdin.on('data',c=>raw+=c);
          process.stdin.on('end',()=>{const rows=JSON.parse(raw);let bad=0,wait=0,ok=0;
           for(const l of rows){const cs=p.tomas(l),src=p.srcLamina(l,l.src);
            bad+=cs.filter(p.vetada).length;
            if(p.fuenteRetirada(src))throw Error('Fuente retirada visible');
            if(src)ok++;else wait++;
           }
           console.log('VISTA_META '+JSON.stringify({laminas:rows.length,opciones_vetadas_visibles:bad,
            imagenes_en_espera:wait,con_imagen_permitida:ok,escrituras_decisiones:0}));
          });"""
          subprocess.run(["node","-e",js],input=json.dumps(raw),text=True,check=True)
          print("PRODUCCION_META "+json.dumps({"reemplazos_pendientes":len(pending),"fuentes_aprobadas_permitidas":len(ready),"fuentes_retiradas_elegibles":0,"escrituras_decisiones":0}))
          print("REEMPLAZOS_PENDIENTES "+json.dumps(pending))
          try:
              report=json.loads(get("datos/mesa-estado.json"))
              print("MESA_PUBLICA "+json.dumps({k:report.get(k) for k in ("estado","causa","generadas","fallidas","limite_pendiente","cartas","modelo_imagen","run_id","revisado_en")}))
          except Exception:print("MESA_PUBLICA "+json.dumps({"estado":"sin informe nuevo"}))
          PY
      - name: Cosechar chinches de todos los tableros que escriben al buzón común
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sala-chinches.yml --ref main -f simular=false
