name: Sala · comprobar GPT Image antes de activarlo
on:
  push:
    branches: [codex/sala-rastrear-rehacer-imagenes-20261012]
    paths: [.github/workflows/sala-rastreo-imagen.yml]
permissions:
  contents: read
  actions: write
jobs:
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0ecc27f42351bba91afc1e770a44a05758c9e23
          persist-credentials: false
      - run: pip install --quiet pillow requests
      - name: Comprobar disponibilidad y una imagen real sin votos ni montaje
        env:
          PYTHONPATH: nube
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,hmac,io,json,os,time,urllib.request,urllib.error
          from PIL import Image
          import sala_cliente as sala
          from motores import imagen
          sala.enmascarar_en_actions()
          key=hmac.new(sala._clave().encode(),b'yod:sala:image-broker:v1',hashlib.sha256).hexdigest()
          print("::add-mask::"+key)
          url="https://yod-cloud-room.onrender.com/sala/image/status"
          end=time.time()+720
          while time.time()<end:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"Authorization":"Bearer "+key}),timeout=20) as r:status=json.load(r)
                  if status.get("ok"):break
              except Exception:pass
              time.sleep(10)
          else:raise SystemExit("Puente de imágenes todavía no disponible")
          print("BROKER_META "+json.dumps(status))
          prompt="High-end architectural editorial photograph, portrait composition. A Mexican family of four sits with an architect around a wide oak table discussing three different miniature architectural models: a storefront, a low-rise apartment building and a family house. The uncle points to the storefront while a neighbor points to apartments, showing their differing ideas. A blank cadastral plan and wooden rulers on the table. Distinct realistic faces, natural anatomically correct hands, candid documentary interaction, accurate perspective, warm window daylight in an elegant beige interior, crisp fine detail, professional full-frame 35mm photography. No letters, captions, text, logos or watermarks."
          rules={"_imagen_request_id":hashlib.sha256(b"sala-gpt-image-prueba-20261012-v1").hexdigest()}
          raw,ext=imagen.openai_broker(prompt,rules)
          im=Image.open(io.BytesIO(raw)).convert("RGB");dim=im.size;im.thumbnail((640,960));out=io.BytesIO();im.save(out,"JPEG",quality=90)
          print("IMAGEN_REAL_META "+json.dumps({"modelo":imagen.modelo_de("openai_broker"),"dimensiones":dim,"bytes":len(raw),"recibo":rules["_imagen_recibo_id"],"receta_sha":rules["_receta_proveedor_sha256"],"generadas":1,"escrituras_decisiones":0}))
          print("FOTO_BASE64 "+base64.b64encode(out.getvalue()).decode())
          PY
