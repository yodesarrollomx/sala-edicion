name: Sala · origen exacto de la captura
on:
  push:
    branches: [codex/sala-rastrear-rehacer-imagenes-20261012]
    paths: [.github/workflows/sala-rastreo-imagen.yml]
permissions:
  contents: read
jobs:
  origen:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - run: pip install --quiet pillow
      - name: Buscar texto en todas las versiones publicadas y candidatas
        run: |
          python3 - <<'PY'
          import base64,collections,concurrent.futures,io,json,re,unicodedata,urllib.request
          from PIL import Image
          base="https://yodesarrollomx.github.io/sala-edicion/"
          active=set(["el-mapa-antes-de-caminar-nube-2026-09-30-5899fb","equipos-que-no-chocan-nube-2026-09-30-3fa992","nombre-antes-despues-nube-2026-09-30-e26b4d","llamada-que-pasa-nube-2026-10-11-11c518","mesa-vacia-nube-2026-10-11-22107b","asi-se-ve-saber-nube-2026-10-11-8dd303","la-ruta-autonoma-nube-2026-10-11-3648fb","llamada-entregable-nube-2026-10-11-70dca7","manos-expertas-en-cada-metro-nube-2026-10-11-630996","tu-terreno-tus-reglas-nube-2026-10-11-37000b","dato-tres-opiniones-nube-2026-10-12-7efce5","doble-via-nube-2026-10-12-419833","el-arquitecto-invisible-nube-2026-10-12-5d478a","la-identidad-no-se-improvisa-nube-2026-10-12-c271db"])
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={"Cache-Control":"no-cache"}),timeout=30) as r:return r.read()
          def tira(pid):return pid,json.loads(get("datos/tiras/"+pid+".json"))
          ids=json.loads(get("datos/tiras/index.json"))
          def norm(s):return unicodedata.normalize("NFKD",str(s)).lower()
          counts=collections.Counter();affected=[];matches=[];allts=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              for pid,t in pool.map(tira,ids):
                  allts.append((pid,t))
                  for l in t.get("laminas",[]):
                      if "la vecina prefiere departamentos" in norm(json.dumps(l,ensure_ascii=False)):
                          matches.append((pid,t,l))
                      if pid in active:
                          for ci,ca in enumerate(l.get("candidatas",[])):
                              counts[(ca.get("motor","sin metadato"),l.get("estado",""))]+=1
                              affected.append({"prop_id":pid,"n":l.get("n"),"estado":l.get("estado"),"candidata":ci+1,**{k:ca.get(k) for k in ("motor","modelo","src","original","huella")}})
          print("MODELOS_OPCIONES_ACTIVAS "+json.dumps([{"motor":k[0],"estado":k[1],"opciones":v} for k,v in counts.items()]))
          print("OPCIONES_ACTIVAS "+json.dumps(affected))
          for pid,t,l in matches:
              cs=l.get("candidatas",[])
              print("CAPTURA_ORIGEN "+json.dumps({"prop_id":pid,"activa":pid in active,"pieza":t.get("pieza"),"n":l.get("n"),"estado":l.get("estado"),"src":l.get("src"),"dice":l.get("dice"),"ve":l.get("ve"),"candidatas":cs,"meta_tira":{k:t.get(k) for k in ("fecha","pieza_slug","origen","base","versiones","run_id")}},ensure_ascii=False))
              paths=[l.get("src")]+[ca.get("src") for ca in cs if "la vecina prefiere departamentos" in norm(ca.get("dice"))]
              for path in dict.fromkeys(paths):
                  if not path or not path.startswith("laminas/"):continue
                  im=Image.open(io.BytesIO(get(path))).convert("RGB");im.thumbnail((480,640));out=io.BytesIO();im.save(out,"JPEG",quality=85)
                  print("FOTO_ORIGEN "+path)
                  print("FOTO_BASE64 "+base64.b64encode(out.getvalue()).decode())
          print("CAPTURA_COINCIDENCIAS "+str(len(matches)))
          if not matches:
              # Imprimir sólo líneas editoriales de las piezas públicas, nunca notas privadas.
              for pid,t in allts:
                  if pid not in active:continue
                  for l in t.get("laminas",[]):
                      print("TEXTO_ACTIVO "+json.dumps({"prop_id":pid,"n":l.get("n"),"dice":l.get("dice"),"candidatas_dice":[ca.get("dice") for ca in l.get("candidatas",[])]},ensure_ascii=False))
              raise SystemExit("No hubo coincidencia exacta en fuentes públicas")
          PY
