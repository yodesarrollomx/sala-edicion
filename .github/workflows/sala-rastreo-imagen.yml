name: Sala · cierre verificable de imágenes y control
on:
  push:
    branches: [codex/sala-rastrear-rehacer-imagenes-20261012]
    paths: [.github/workflows/sala-rastreo-imagen.yml]
permissions:
  contents: read
  actions: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Identificar el proceso que conserva el turno sin modificarlo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          def api(path):return json.loads(subprocess.run(["gh","api","repos/yodesarrollomx/sala-edicion/"+path],check=True,capture_output=True,text=True).stdout)
          ref=api("git/ref/heads/runtime/online-data-lease")
          info=json.loads(api("git/commits/"+ref["object"]["sha"])["message"])
          run=api("actions/runs/"+str(info["run_id"]))
          print("TURNO_REAL "+json.dumps({"state":info["state"],"run_id":info["run_id"],"process":info["process"],"workflow":run["name"],"status":run["status"]}))
          PY
      - uses: actions/checkout@v4
        with:
          ref: 11af0881e8c2babc047f09cc940bd3d19609c72b
          filter: blob:none
          sparse-checkout: nube
          persist-credentials: false
      - run: pip install --quiet requests pillow
      - name: Verificar diez imágenes montadas y sus modelos en el sitio
        env:
          PYTHONPATH: nube
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,urllib.request
          base="https://yodesarrollomx.github.io/sala-edicion/"
          ids=["doble-via-nube-2026-10-12-cb73f9","la-identidad-no-se-improvisa-nube-2026-10-12-411a9f","manos-expertas-en-cada-metro-nube-2026-10-12-cad2bf"]
          cards=[]
          for pid in ids:
              with urllib.request.urlopen(base+"datos/tiras/"+pid+".json",timeout=30) as r:t=json.load(r)
              for l in t['laminas']:
                  for c in l.get('candidatas') or []:
                      if c.get("run_id")=="38310054319":cards.append(c)
          def verify(c):
              with urllib.request.urlopen(base+c["src"],timeout=30) as r:
                  raw=r.read();return c["modelo"]=="gpt-image-1.5" and r.status==200 and raw.startswith(b"\xff\xd8\xff")
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:results=list(pool.map(verify,cards))
          report={"imagenes_montadas":len(cards),"archivos_publicos_verificados":sum(results),"modelos":sorted({c["modelo"] for c in cards}),"cartas":len(ids),"nuevas_generaciones":0,"votos_escritos":0}
          print("PUBLICACION_REAL "+json.dumps(report))
          if len(cards)!=10 or not all(results):raise SystemExit("Montaje incompleto")
          with urllib.request.urlopen(base+"datos/mesa-estado.json",timeout=30) as r:state=json.load(r)
          print("MESA_PUBLICA "+json.dumps(state))
          import sala_cliente as sala,sala_mesa as mesa
          from sala_produccion import cargar,resolver_tira
          from motores.politica_imagen import depurar_tira,vetada,fuente_retirada,requiere_reemplazo,POLITICA
          sala.enmascarar_en_actions()
          def tira(pid):
              with urllib.request.urlopen(base+"datos/tiras/"+pid+".json",timeout=30) as r:return json.load(r)
          ctx=cargar(tira_reader=tira);mesa._contexto_produccion=ctx
          counts={'propuestas_vigentes':0,'laminas_vigentes':0,'alternativas_historicas_vetadas':0,'fuentes_retiradas_aprobadas_elegibles':0,'sustituciones_pendientes':0,'tomas_gpt_en_fuentes_vigentes':0}
          for p in ctx['propuestas']:
              if not p.get('laminas'):continue
              t=tira(p['id']);d=ctx['decisiones']['propuestas'].get(p['id']) or {}
              t,_=depurar_tira(resolver_tira(t,d,p));counts['propuestas_vigentes']+=1
              for l in t.get('laminas') or []:
                  counts['laminas_vigentes']+=1
                  counts['sustituciones_pendientes']+=int(requiere_reemplazo(l))
                  counts['fuentes_retiradas_aprobadas_elegibles']+=int(l.get('estado')=='aprobada' and fuente_retirada(l.get('src')))
                  for c in l.get('candidatas') or []:
                      counts['alternativas_historicas_vetadas']+=int(vetada(c))
                      counts['tomas_gpt_en_fuentes_vigentes']+=int(c.get('modelo')=='gpt-image-1.5')
          print("FUENTES_VIGENTES "+json.dumps(counts))
          if counts['fuentes_retiradas_aprobadas_elegibles']:raise SystemExit('Fuente vetada elegible para producción')
          import os,re,time
          expected='cb7382ae70'
          page=''
          for attempt in range(30):
              with urllib.request.urlopen(base+"?control="+os.environ["GITHUB_RUN_ID"],timeout=30) as r:page=r.read().decode()
              match=re.search(r"const SELLO_SALA='([^']+)'",page)
              if match and match.group(1)==expected:break
              time.sleep(5)
          else:raise SystemExit('La versión nueva no está confirmada en el sitio')
          if "const deLaTira=POLITICA_IMAGEN.tomas(l)" not in page or ".filter(f=>!POLITICA_IMAGEN.vetada({src:evidenciaSrc(f)" not in page:raise SystemExit("Falta el filtro real del árbol")
          print("VISUALIZACION_PUBLICA "+json.dumps({"sello":expected,"filtro_modelos_retirados_en_arbol":True,"votos_escritos":0}))
          PY
