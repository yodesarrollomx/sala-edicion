name: Sala · ronda de chinches y comprobación de acceso
on:
  push:
    branches: [codex/sala-rastrear-rehacer-imagenes-20261012]
    paths: [.github/workflows/sala-rastreo-imagen.yml]
permissions:
  contents: read
  actions: write
jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dde4ab0151c5cc36071882380afe7ecf495ecef6
          persist-credentials: false
      - name: Comprobar credencial alternativa existente sin exponerla
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          print("CREDENCIAL_GPT_ACTIONS_CONFIGURADA",bool(os.environ.get("OPENAI_API_KEY","").strip()))
          PY
      - name: Ejecutar puente real de chinches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime,json,subprocess
          started=datetime.datetime.now(datetime.timezone.utc).isoformat()
          subprocess.run(["gh","workflow","run","sala-chinches.yml","--ref","main","-f","simular=false"],check=True)
          print("RONDA_CHINCHES_SOLICITADA "+json.dumps({"desde":started,"modo":"real","workflow":"sala-chinches.yml"}))
          PY
