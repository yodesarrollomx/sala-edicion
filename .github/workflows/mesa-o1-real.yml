name: Refrescar respaldo despues del montaje real
on:
  push:
    branches: [codex/mesa-o1-real-20261017]
permissions:
  contents: read
  actions: write
jobs:
  relevo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Retirar verificador anterior sustituido
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: yodesarrollomx/sala-edicion
        run: gh run cancel 39073651154 || true
      - name: Esperar montaje confirmado y actualizar respaldo publico
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: yodesarrollomx/sala-edicion
        run: |
          gh run watch 39073527776 --exit-status --interval 20
          gh workflow run sala-relevo.yml --ref main -f simular=false
