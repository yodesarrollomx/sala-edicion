name: Diagnosticar contrato real de medios
on:
  push:
    branches: [codex/mesa-o1-real-20261017]
permissions:
  contents: write
  actions: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: yodesarrollomx/sala-edicion
        run: |
          gh api --paginate 'repos/yodesarrollomx/sala-edicion/releases?per_page=100' --jq '.[] | select(.tag_name | startswith("sala-media-")) | {id,tag_name,draft,immutable,body,assets:[.assets[]|{id,name,state,size,content_type,digest,browser_download_url}]}'
