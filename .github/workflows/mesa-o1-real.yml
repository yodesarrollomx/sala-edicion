name: Sala · cuatro ciclos completos con entregables reales
on:
  push:
    branches: [codex/mesa-o1-real-20261017]
    paths-ignore: ['evidencia-cuatro-ciclos/**']
permissions:
  contents: write
  actions: write
jobs:
  ciclos:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Relevar sólo el verificador anterior y conservar el recorrido ya iniciado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/yodesarrollomx/sala-edicion/actions/runs/39075221969/cancel || true
          for i in $(seq 1 20); do
            state=$(gh api repos/yodesarrollomx/sala-edicion/actions/runs/39075221969 --jq .status)
            [ "$state" = completed ] && exit 0
            sleep 3
          done
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: operaciones
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
          persist-credentials: false
          sparse-checkout: nube
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          pip install --quiet requests google-auth
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Ejecutar cuatro recorridos y verificar imagenes y video completos
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: yodesarrollomx/sala-edicion
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: node operaciones/cuatro-ciclos.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuatro-ciclos-reales-bitacora-y-capturas
          path: evidencia-cuatro-ciclos/
      - name: Conservar bitacora y capturas publicas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse evidencia-cuatro-ciclos/
          if ! git diff --cached --quiet; then
            git commit -m "evidencia: cuatro ciclos completos y bytes de entregables"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:codex/mesa-o1-real-20261017
          fi
