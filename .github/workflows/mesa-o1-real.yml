name: Leer lote real y respaldo publico sin credenciales
on:
  push:
    branches: [codex/mesa-o1-real-20261017]
permissions: {}
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,json,time
          base="https://yodesarrollomx.github.io/sala-edicion/"
          def read(p):
              with urllib.request.urlopen(base+p+"?auditoria="+str(time.time_ns()),timeout=40) as r:return json.load(r)
          t=read("datos/tiras/dato-servilleta-3-nube-2026-10-17-5debd0.json")
          print(json.dumps({"laminas":[{"n":l.get("n"),"candidatas":[{k:c.get(k) for k in ("modelo","motor","src","original")} for c in l.get("candidatas",[])]}for l in t.get("laminas",[])]}))
          m=read("datos/manifiesto.json")
          print(json.dumps({"keys":list(m),"propuestas":[{"id":p.get("id"),"tipo":p.get("tipo")}for p in m.get("propuestas",[]) if "servilleta" in str(p.get("id"))]}))
          print(json.dumps(read("version-online.json")))
          PY
