name: Montaje con guiones actuales y respaldo publico
on:
  push:
    branches: [codex/mesa-o1-real-20261017]
permissions:
  contents: read
  actions: write
jobs:
  relevo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Drenar recorrido de version sustituida
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: yodesarrollomx/sala-edicion
        run: gh run cancel 39073596938 || true
      - name: Esperar montaje actual antes del relevo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: yodesarrollomx/sala-edicion
        run: |
          for intento in $(seq 1 90); do
            estado=$(gh api repos/yodesarrollomx/sala-edicion/actions/runs/39073909910/jobs --jq '.jobs[] | select(.name=="mesa / mesa") | .status+":"+(.conclusion//"")')
            if [ "$estado" = "completed:success" ]; then
              gh workflow run sala-relevo.yml --ref main -f simular=false
              exit 0
            fi
            case "$estado" in completed:*) echo "$estado"; exit 1;; esac
            sleep 20
          done
          exit 1
