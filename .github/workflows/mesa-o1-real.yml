name: Comprobar salida de medios para produccion O1
on:
  push:
    branches: [codex/mesa-o1-real-20261017]
permissions:
  contents: read
  actions: write
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: yodesarrollomx/sala-edicion
        run: |
          curl --fail --silent 'https://yodesarrollomx.github.io/sala-edicion/version-online.json?prueba=medios2'
          gh workflow run sonda-medios-publicos.yml --ref main -f aplicar=true
