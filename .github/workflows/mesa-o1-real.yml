name: Producir laminas pendientes con O1 verificado
on:
  push:
    branches: [codex/mesa-o1-real-20261017]
permissions:
  contents: read
  actions: write
jobs:
  mesa:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: yodesarrollomx/sala-edicion
        run: gh workflow run sala-mesa.yml --ref main -f modo=montar
