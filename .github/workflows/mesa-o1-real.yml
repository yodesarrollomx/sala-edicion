name: Comprobar imagen externa en navegador real
on:
  push:
    branches: [codex/mesa-o1-real-20261017]
permissions: {}
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            try {
              const page=await browser.newPage();
              await page.goto('https://yodesarrollomx.github.io/sala-edicion/',{waitUntil:'domcontentloaded'});
              const result=await page.evaluate(async()=>{
                const img=new Image();
                const loaded=new Promise((resolve,reject)=>{img.onload=()=>resolve({width:img.naturalWidth,height:img.naturalHeight});img.onerror=()=>reject(Error('imagen no carga'));setTimeout(()=>reject(Error('timeout')),30000)});
                img.src='https://github.com/yodesarrollomx/sala-edicion/releases/download/sala-media-677d8c6a530820cc777d78a5ce361d7a7149a828f76b9d82f21646e27a9b26c1-arranque/0c025fcf37ddd8d3d7bb36b245c25192afa17287e55d1bd14551e851030e0d85.png';
                return loaded;
              });
              if(result.width!==8||result.height!==8)throw Error('dimensiones');
              console.log(JSON.stringify({scope:'transporte-cdn-desde-origen-sala',...result,produccion_acreditada:false}));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          JS
