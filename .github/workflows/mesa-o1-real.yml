name: Verificar medios tras publicar reparacion draft
on:
  push:
    branches: [codex/mesa-o1-real-20261017]
permissions:
  contents: read
  actions: write
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: yodesarrollomx/sala-edicion
        run: |
          for intento in $(seq 1 60); do
            listo=$(gh api 'repos/yodesarrollomx/sala-edicion/actions/runs?branch=main&per_page=25' --jq '[.workflow_runs[] | select(.head_sha=="1ec9697058c044bc3544fd314c0c535b14e9d524" and .path==".github/workflows/publicar.yml" and .conclusion=="success")]|length')
            if [ "$listo" -gt 0 ]; then
              gh workflow run sonda-medios-publicos.yml --ref main -f aplicar=true
              exit 0
            fi
            sleep 10
          done
          exit 1
