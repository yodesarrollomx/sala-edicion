name: Preparar reparacion de publicacion sin repetir produccion
on:
  push:
    branches: [codex/mesa-o1-real-20261017]
permissions:
  contents: read
  actions: write
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: yodesarrollomx/sala-edicion
        run: |
          gh run cancel 39071256923 || true
          gh api repos/yodesarrollomx/sala-edicion/immutable-releases || true
          gh api repos/yodesarrollomx/sala-edicion/actions/variables/SALA_MEDIOS_PUBLICOS --jq '{name,value}' || true
