# Por qué existe (25-sep-2026): una de las tres puertas de la Sala (ver sala-diario.yml).
# Aquí late lo que corre todo el día, a los mismos minutos de siempre.
#
# 9-nov-2026 · Sala corta (docs/SALA-CORTA-20261109.md). El productor y el ejecutor ya NO
# tienen horario: abren y corren escena, voz y corte, la línea de video que Dirección puso en
# pausa, y las láminas rechazadas las rehace el montador de la mesa. Conservan su botón
# (proceso: productor / ejecutor) y su archivo. Lo medido ese día sobre 68 corridas: GitHub
# entrega cada horario de esta puerta cada 3 a 7 horas, diga lo que diga el cron; por eso la
# mesa, el arranque y las chinches se quedan como están y el reloj confiable del ciclo es la
# tarea programada del consejo, que los lanza por su botón.
name: Sala · Cada hora

on:
  schedule:
    - cron: '15 */2 * * *'  # semáforo de las máquinas
    - cron: '45 * * * *'    # puente de chinches
    - cron: '35 * * * *'    # mesa (28-sep: máximo potencial — lo nuevo llega a tu mesa cada hora)
    - cron: '5 * * * *'     # arranque (28-sep: «si elijo una idea, que empiece ya», no hasta mañana)
  workflow_dispatch:
    inputs:
      proceso:
        description: 'Qué correr ahora (cada proceso conserva además su propio botón)'
        type: choice
        options: [maquinas, ejecutor, productor, chinches, al-dia, arranque, mesa]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  maquinas:
    if: (github.event.schedule == '15 */2 * * *') || inputs.proceso == 'maquinas'
    uses: ./.github/workflows/sala-maquinas.yml
    secrets: inherit
  ejecutor:        # sólo a mano desde el 9-nov-2026 (video en pausa)
    if: inputs.proceso == 'ejecutor'
    uses: ./.github/workflows/sala-ejecutor.yml
    secrets: inherit
  productor:       # sólo a mano desde el 9-nov-2026 (video en pausa)
    if: inputs.proceso == 'productor'
    uses: ./.github/workflows/sala-productor.yml
    secrets: inherit
  mesa:
    if: (github.event.schedule == '35 * * * *') || inputs.proceso == 'mesa'
    uses: ./.github/workflows/sala-mesa.yml
    secrets: inherit
  arranque:
    if: (github.event.schedule == '5 * * * *') || inputs.proceso == 'arranque'
    uses: ./.github/workflows/sala-arranque.yml
    with:
      modo: arrancar      # sólo arrancar ideas elegidas; el semillero va aparte (y en pausa por REGLAS semillero_activo)
    secrets: inherit
  chinches:
    if: (github.event.schedule == '45 * * * *') || inputs.proceso == 'chinches'
    uses: ./.github/workflows/sala-chinches.yml
    secrets: inherit

  # 26-sep-2026 · GitHub dispara los horarios con horas de retraso y a veces NO los dispara
  # (la mesa del 26-sep nunca salió). Esta puerta sí late muchas veces al día, así que en
  # cada latido revisa si la mesa y el arranque de HOY (Hermosillo) ya corrieron; si no,
  # los lanza. Un proceso en curso cuenta como corrido; tras 2 fallas del día no insiste
  # (su propio «Avisar si algo falló» ya dio la alarma).
  al-dia:
    if: github.event_name == 'schedule' || inputs.proceso == 'al-dia'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Lanzar lo del día que GitHub no disparó
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail
          hoy=$(TZ=America/Hermosillo date +%F); hora=$(TZ=America/Hermosillo date +%H%M)
          desde="${hoy}T12:00:00Z"   # 05:00 Hermosillo
          # «ya corrió» = una corrida de HOY que llegó a «Verificar antes de publicar» (un simulacro
          # se lo salta y NO cuenta: el 26-sep uno pasó por «éxito» y la mesa siguió vacía).
          # En curso cuenta como corrida, para no lanzar dos.
          estado(){
            local p=$1 ok=0 f=0 id j
            local ids; ids=$( { gh api "repos/$R/actions/workflows/sala-$p.yml/runs?created=%3E%3D$desde&per_page=30" --jq '.workflow_runs[].id'
                                gh api "repos/$R/actions/workflows/sala-diario.yml/runs?created=%3E%3D$desde&per_page=30" --jq '.workflow_runs[].id'; } )
            for id in $ids; do
              while IFS=$'\t' read -r st co ver; do
                [ -z "$st" ] && continue
                if [ "$st" != completed ]; then ok=1
                elif [ "$co" = failure ]; then f=$((f+1))
                elif [ "$ver" = success ]; then ok=1; fi
              done < <(gh api "repos/$R/actions/runs/$id/jobs" --jq ".jobs[]|select(.name==\"$p\" or .name==\"$p / $p\")|[.status, (.conclusion // \"\"), ([.steps[]?|select(.name|startswith(\"Verificar antes de publicar\"))|.conclusion][0] // \"\")]|@tsv")
            done
            [ $ok = 1 ] && echo ok || echo "fallas:$f"
          }
          lanza(){ # $1 proceso · $2 desde qué hora (HHMM Hermosillo) · $3 modo REAL (nunca simular)
            [ "$hora" -lt "$2" ] && { echo "$1: aún no es hora ($hora < $2)"; return; }
            local e; e=$(estado "$1")
            if [ "$e" = ok ]; then echo "$1: ya corrió hoy"
            elif [ "${e#fallas:}" -ge 2 ]; then echo "::warning::$1 falló 2 veces hoy; no se relanza"
            else echo "::notice::$1 no corrió hoy ($hoy): lo lanzo"; gh workflow run "sala-$1.yml" -R "$R" --ref main -f modo="$3"; fi
          }
          lanza mesa 0545 montar
          lanza arranque 0555 todo
