# Prueba de un solo uso (13-nov-2026, pedida por Dirección): ¿qué generador de imagen gratuito contesta hoy?
# Sólo dice si cada motor devolvió una imagen y cuánto tardó. No guarda, no sube y no publica nada.
# No prueba los de pago. Se borra con su rama al terminar.
name: Prueba de motores de imagen (un solo uso)
on:
  push:
    branches: [claude/prueba-motores-imagen]
permissions:
  contents: read
jobs:
  probar:
    if: github.repository == 'yodesarrollomx/sala-edicion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet pillow requests gradio_client
      - name: Probar cada motor gratuito con una receta neutra
        working-directory: nube
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'PY'
          import time, signal
          from motores import imagen
          receta = ("Architectural editorial photograph of a sunlit residential courtyard with a wooden table, "
                    "rolled site plans and a small architectural model, warm natural daylight, beige and terracotta palette")
          for nombre in ['cloudflare_flux2', 'cloudflare', 'hf', 'hidream_demo']:
              t = time.time()
              try:
                  signal.alarm(240)
                  datos, ext = imagen.MOTORES[nombre](receta + imagen.SIN_LETRAS, {})
                  signal.alarm(0)
                  print(f'OK  {nombre}: {len(datos)} bytes .{ext} en {time.time()-t:.0f} s')
              except BaseException as e:
                  signal.alarm(0)
                  print(f'NO  {nombre}: {type(e).__name__}: {str(e)[:200]} ({time.time()-t:.0f} s)')
          PY
