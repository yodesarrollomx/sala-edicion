# El semáforo de centinelas. En la Mac leía launchd; aquí lee la API de Actions, porque en la
# nube los centinelas SON los workflows. Escribe datos/maquinas.json, que es lo que pinta la
# franja «Las máquinas» dentro de la Sala.
#
# Efecto lateral buscado: este commit periódico mantiene el repo con actividad. GitHub apaga
# solos los crons de un repo que lleva 60 días quieto — y apagarlos sin avisar es exactamente
# la falla que este sistema no puede permitirse.
name: Semáforo de la Sala

on:
  # El horario vive en sala-diario.yml / sala-cada-hora.yml (25-sep-2026): aquí solo se llama.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sala-maquinas
  cancel-in-progress: false

env:
  SALA_PUBLICADOR_MODO: snapshots

jobs:
  maquinas:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Hidratar último snapshot y serializar la publicación de datos
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULAR: ${{ inputs.simular }}
          MODO: ${{ inputs.modo }}
        run: |
          lock=--lock
          [ "$SIMULAR" = true ] && lock=
          [ "$MODO" = simular ] && lock=
          python3 nube/snapshots_online.py bootstrap --proceso maquinas $lock

      - name: Leer la salud de los centinelas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 nube/sala_maquinas.py

      - name: Verificar antes de publicar (las reglas del repo)
        run: |
          pip install --quiet google-auth requests pillow
          python3 nube/verificar.py

      - name: Guardar snapshot privado de datos ya validados
        id: guardar
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 nube/publicar_git.py integrar --proceso maquinas

      - name: Publicar datos y esperar su recibo exacto
        if: steps.guardar.outputs.hubo == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.guardar.outputs.merge_sha }}
        run: python3 nube/publicar_git.py publicar --proceso maquinas --sha "$MERGE_SHA"

      - name: Liberar el mutex incluso si hubo un fallo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 nube/snapshots_online.py liberar
