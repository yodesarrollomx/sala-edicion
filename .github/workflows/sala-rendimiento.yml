name: Medir lectura de Sala
on:
  push:
    branches: [main]
    paths: ['nube/medir_lectura_sala.py', '.github/workflows/sala-rendimiento.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  medir:
    if: github.repository == 'yodesarrollomx/sala-edicion' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: nube
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dos GET del día; sólo métricas sin payload ni claves
        env:
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
        run: python3 nube/medir_lectura_sala.py
