# Por qué existe: «que cuando guarde el avance se mande a producción en automático».
# Los productores guardan mediante PR + checks y solicitan su SHA integrado.
#
# Pero con compuerta: si el verificador falla, NO se publica y el sitio vivo se queda en la
# última versión buena. Antes no existía esa red — un index.html roto llegaba a producción en
# cuanto tocaba main, porque Pages servía la rama directo.
#
# OJO, un clic manual una sola vez: Settings → Pages → Source = «GitHub Actions».
# Mientras esté en «Deploy from a branch», este workflow corre y no sirve de nada.
name: Publicar la Sala
run-name: 'Sala publicar · ${{ inputs.sha || github.sha }} · ${{ inputs.publicacion_id || github.run_id }}'

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit completo integrado en main (vacío = commit de la corrida)'
        type: string
        required: false
      publicacion_id:
        description: 'Identificador de correlación del productor, sin datos de negocio'
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

# Dos publicaciones a la vez se pisan. La última en entrar es la que vale, pero la de en
# medio no se cancela: que termine y la siguiente la reemplace.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validar y seleccionar el commit integrado
        env:
          PUBLICAR_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$PUBLICAR_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'SHA inválido'; exit 1; }
          git cat-file -e "$PUBLICAR_SHA^{commit}"
          git merge-base --is-ancestor "$PUBLICAR_SHA" refs/remotes/origin/main || {
            echo 'El commit solicitado no pertenece a main'; exit 1;
          }
          git checkout --detach "$PUBLICAR_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Librerías que la prueba de sala_drive.py necesita para importar
        run: pip install --quiet google-auth requests pillow
      - name: La compuerta — nada roto llega a producción
        run: python3 nube/verificar.py

      - name: Comprobar las compuertas de publicación sin red
        run: python3 -m unittest discover -s tests -p 'publicar_git_test.py'

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: No publicar una versión que ya quedó atrás de main
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICAR_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [ "$actual" = "$PUBLICAR_SHA" ] || {
            echo 'main avanzó; publicar su nueva punta antes de montar cartas'; exit 1;
          }
          # La lectura y deploy-pages no son una transacción. El candado pages
          # evita despliegues simultáneos; main aún puede avanzar entre estos pasos.
      - id: despliegue
        uses: actions/deploy-pages@v4

      - name: Comprobar que la Sala en vivo contesta
        run: |
          # No se canta victoria sin curl: Pages tarda en propagar y ha servido la raíz
          # cacheada antes (es el origen del sello de versión).
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
                   "https://yodesarrollomx.github.io/sala-edicion/")
            echo "intento $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::la Sala no contestó 200 tras publicar; no montar cartas"
          exit 1
