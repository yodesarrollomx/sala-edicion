# Código de main por PR/CI; datos públicos versionados privadamente.
name: Publicar la Sala
run-name: 'Sala · publicacion=${{ inputs.publicacion_id || github.run_id }} · sha=${{ inputs.sha || github.sha }}'
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        type: string
        required: false
      publicacion_id:
        type: string
        required: false
      snapshot_id:
        description: 'Versión privada validada; vacío = última publicada'
        type: string
        required: false
      lease:
        description: 'SHA del mutex vigente; sin credenciales'
        type: string
        required: false
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  SALA_PUBLICADOR_MODO: snapshots
jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Seleccionar código aprobado de main
        env:
          PUBLICAR_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$PUBLICAR_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git merge-base --is-ancestor "$PUBLICAR_SHA" refs/remotes/origin/main
          git checkout --detach "$PUBLICAR_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet google-auth requests pillow
      - name: Validar versión de datos y mutex antes de construir
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICAR_SHA: ${{ inputs.sha || github.sha }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id || '0' }}
          LEASE: ${{ inputs.lease }}
        run: python3 nube/snapshots_online.py stage --sha "$PUBLICAR_SHA" --snapshot-id "$SNAPSHOT_ID" --lease "$LEASE"
      - name: Compuertas de producción
        run: |
          python3 nube/verificar.py
          python3 -m unittest discover -s tests -p 'publicar_git_test.py'
          python3 -m unittest discover -s tests -p 'snapshots_online_test.py'
          node --test tests/sala-carga.test.cjs tests/sala-imagenes.test.cjs
      - name: Construir bundle público sin logs ni archivos privados del runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 nube/snapshots_online.py bundle --destino "$RUNNER_TEMP/sitio-online"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/sitio-online
      - name: Verificar main justo antes de desplegar
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICAR_SHA: ${{ inputs.sha || github.sha }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [ "$actual" = "$PUBLICAR_SHA" ] || exit 1
      - id: despliegue
        uses: actions/deploy-pages@v4
      - name: Confirmar recibo exacto del sitio antes de declarar publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 nube/snapshots_online.py confirmar
      - name: Montar tiras de un PR de datos revisado
        if: github.event_name == 'push'
        working-directory: nube
        env:
          GH_TOKEN: ${{ github.token }}
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
        run: python3 sala_mesa.py --montar-commit
