name: Mostrar avance visual de las fotos HiDream
on:
  push:
    branches: [codex/sala-hidream-lote-20261012]
    paths: [.github/workflows/sala-hidream-avance.yml]
permissions:
  contents: write
  actions: read
jobs:
  avance:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests pillow
      - name: Crear vista de las fotos ya publicadas, sin generar ni montar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,io,json,os,time
          import requests
          from PIL import Image,ImageOps,ImageDraw,ImageFont
          branch="codex/sala-hidream-lote-20261012"
          prefix="operaciones/hidream-lote-20261012/"
          api="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]
          site="https://yodesarrollomx.github.io/sala-edicion/"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          run="38338150745";cache={};last=0
          def read(name):
              r=requests.get(api+"/contents/"+prefix+name,headers=headers,params={"ref":branch},timeout=40)
              if r.status_code==404:return None
              r.raise_for_status();return json.loads(base64.b64decode(r.json()["content"]))
          def public(path):
              r=requests.get(site+path,headers={"Cache-Control":"no-cache"},timeout=40)
              r.raise_for_status();return r.content
          deadline=time.monotonic()+5400
          while time.monotonic()<deadline:
              progress=read("cierre.json") or read("progreso.json")
              if progress and str(progress.get("run_id"))==run:
                  count=sum(x["laminas_nuevas"] for x in progress["montadas"])
                  if count!=last:
                      images=[]
                      for item in progress["montadas"]:
                          for tid in item["tiras"]:
                              t=json.loads(public("datos/tiras/"+tid+".json"))
                              for lam in t["laminas"]:
                                  c=next((c for c in lam.get("candidatas") or [] if c.get("motor")=="hidream_demo"),None)
                                  if c is None:continue
                                  if c["src"] not in cache:cache[c["src"]]=public(c["src"])
                                  images.append((item["pieza"],lam["n"],cache[c["src"]]))
                      cols=4;w=270;h=380
                      grid=Image.new("RGB",(cols*w,((len(images)+cols-1)//cols)*h),"#f3eee6")
                      draw=ImageDraw.Draw(grid)
                      try:font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",12)
                      except OSError:font=ImageFont.load_default()
                      for i,(title,n,raw) in enumerate(images):
                          pic=ImageOps.contain(Image.open(io.BytesIO(raw)).convert("RGB"),(w-12,h-42))
                          x=(i%cols)*w;y=(i//cols)*h
                          grid.paste(pic,(x+(w-pic.width)//2,y+6))
                          draw.text((x+7,y+h-30),(title+" · L"+str(n))[:37],fill="#15120c",font=font)
                      out=io.BytesIO();grid.save(out,"JPEG",quality=86,optimize=True)
                      name=prefix+"avance-fotos.jpg";url=api+"/contents/"+name
                      r=requests.get(url,headers=headers,params={"ref":branch},timeout=40)
                      body={"branch":branch,"message":"HiDream: vista de "+str(count)+" fotos ya montadas","content":base64.b64encode(out.getvalue()).decode()}
                      if r.status_code==200:body["sha"]=r.json()["sha"]
                      elif r.status_code!=404:r.raise_for_status()
                      r=requests.put(url,headers=headers,json=body,timeout=45);r.raise_for_status()
                      print("HIDREAM_AVANCE_VISUAL "+str(count),flush=True);last=count
                  if "cola_restante" in progress:break
              r=requests.get(api+"/actions/runs/"+run,headers=headers,timeout=40);r.raise_for_status()
              if r.json()["status"]=="completed" and not read("cierre.json"):break
              time.sleep(25)
          PY
