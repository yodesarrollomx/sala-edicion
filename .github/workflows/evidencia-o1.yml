name: Evidencia visual de Sala con O1 publicado
on:
  push:
    branches: [codex/evidencia-o1-publicada-20261017]
    paths-ignore: ['evidencia-o1/**']
permissions:
  contents: write
jobs:
  evidencia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            operaciones
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node operaciones/verificar-o1-publicada.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-o1-publicada
          path: evidencia-o1/
      - name: Conservar capturas y resultado sin alterar el sitio
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -d evidencia-o1 || exit 0
          git config user.name 'codex'
          git config user.email 'codex@users.noreply.github.com'
          git add --sparse evidencia-o1/
          git diff --cached --quiet && exit 0
          git commit -m 'evidencia: recorrido visual real de Sala O1'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:codex/evidencia-o1-publicada-20261017
