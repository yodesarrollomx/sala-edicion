name: Sala O1 real · cuatro recorridos con ocho tomas verificadas
on:
  push:
    branches: [codex/evidencia-o1-publicada-20261017]
    paths-ignore: ['evidencia-o1-real/**']
permissions:
  contents: write
jobs:
  evidencia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: operaciones
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node operaciones/verificar-o1-publicada.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sala-o1-real-capturas-y-bitacora
          path: evidencia-o1-real/
      - name: Conservar pruebas públicas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse evidencia-o1-real/
          if ! git diff --cached --quiet; then
            git commit -m "evidencia: recorrido real de ocho tomas O1"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:codex/evidencia-o1-publicada-20261017
          fi
