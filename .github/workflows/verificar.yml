# Por qué existe: las reglas del repo vivían en prosa (CLAUDE.md, docs/SALA-SISTEMA.md) y en
# un hook pre-push de la Mac. Un push desde la web, desde el teléfono o desde un runner NO
# corre hooks: en cuanto el ciclo dejó la Mac, las reglas se quedaron sin quien las exigiera.
# Aquí vuelven a tener dientes.
#
# Este workflow NO recibe secrets a propósito: corre en pull requests, donde hacer POST a un
# /exec «para probar» está prohibido (hay backends que escriben). Todas sus pruebas son de
# red cero.
name: Verificar la Sala

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reglas del repo, sello de versión e integridad de los datos
        run: python3 nube/verificar.py
