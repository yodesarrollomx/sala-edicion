# Por qué existe: las reglas del repo vivían en prosa (CLAUDE.md, docs/SALA-SISTEMA.md) y en
# un hook pre-push de la Mac. Un push desde la web, desde el teléfono o desde un runner NO
# corre hooks: en cuanto el ciclo dejó la Mac, las reglas se quedaron sin quien las exigiera.
# Aquí vuelven a tener dientes.
#
# Este workflow NO recibe secrets a propósito: corre en pull requests, donde hacer POST a un
# /exec «para probar» está prohibido (hay backends que escriben). Todas sus pruebas son de
# red cero.
name: Verificar la Sala

on:
  # En cada push a main las pruebas ya corren dentro de publicar.yml; aquí solo PR y a mano.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El repo guarda cientos de originales PNG y videos pesados. Ninguna
          # prueba de CI necesita bajar esos binarios para validar reglas,
          # contratos, hojas y las referencias de las tiras.
          sparse-checkout: |
            .github
            datos
            gas
            nube
            tests
            docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Librerías que la prueba de sala_drive.py necesita para importar
        # No hace falta credencial real: prueba_drive_logica() genera su propia
        # cuenta de servicio de mentira (RSA propio) y nunca toca la red — pero
        # sí necesita poder IMPORTAR google-auth para construirla.
        run: pip install --quiet google-auth requests pillow
      - name: Reglas del repo, sello de versión e integridad de los datos
        run: python3 nube/verificar.py
      - name: Probar recuperación de Relevo (sin Google ni credenciales)
        run: python3 -m unittest discover -s tests -p 'sala_cliente_test.py' -v
      - name: Pruebas aisladas de PR automático y verificación de checks
        run: python3 -m unittest discover -s tests -p publicar_git_test.py
      - name: Pruebas de carga inicial de Hoy (sin red)
        run: node --test tests/sala-carga.test.cjs
      - name: Pruebas de fotos publicadas, zoom y reintentos
        run: node --test tests/sala-imagenes.test.cjs
      - name: Pruebas de conciliación de COLA con fechas de Sheets
        run: python3 -m unittest discover -s tests -p cola_salud_test.py -v
