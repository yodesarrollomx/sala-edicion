# El relevo diario. Antes: launchd en la Mac (mx.yodesarrollo.relevo) a las 6, 9, 12, 15 y
# 18 h. Si la Mac se dormía, la Sala se quedaba sin respaldo espejo y nadie se enteraba.
#
# Cron en UTC-7 fijo (America/Hermosillo, sin horario de verano), igual que el vigía de
# yod-portal. Aviso honesto: los crons de Actions se retrasan de 5 a 30+ min en horas pico.
# El único horario que tiene que ser exacto —el correo de las 7:00— lo manda Google desde el
# propio Apps Script, no nosotros.
name: Relevo de la Sala

on:
  # El horario vive en sala-diario.yml / sala-cada-hora.yml (25-sep-2026): aquí solo se llama.
  workflow_call:
  workflow_dispatch:
    inputs:
      simular:
        description: 'Sólo decir qué haría, sin escribir'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# Invariante 53 trasladada: en un runner efímero no hay candado de archivo. Dos relevos a la
# vez se pisarían al commitear. No se cancela el que va: se espera.
concurrency:
  group: sala-relevo
  cancel-in-progress: false

jobs:
  relevo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar configuración de la identidad publicadora
        if: ${{ !inputs.simular }}
        env:
          APP_ID: ${{ vars.YOD_PUBLISHER_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.YOD_PUBLISHER_APP_PRIVATE_KEY }}
        run: |
          if ! [[ "$APP_ID" =~ ^[0-9]+$ ]] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo '::error::Falta configurar la GitHub App publicadora antes de generar datos.'
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cosechar el día y rehacer el respaldo espejo
        id: relevo
        working-directory: nube
        env:
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
        run: |
          set +e
          python3 sala_relevo.py ${{ inputs.simular && '--simular' || '' }} 2>&1 | tee ../relevo.log
          codigo=${PIPESTATUS[0]}
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verificar antes de publicar (las reglas del repo)
        if: steps.relevo.outputs.codigo == '0' && !inputs.simular
        run: |
          pip install --quiet google-auth requests
          python3 nube/verificar.py

      - name: Detectar los archivos generados pendientes
        id: cambios
        if: steps.relevo.outputs.codigo == '0' && !inputs.simular
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 nube/publicar_git.py preparar --proceso relevo

      - name: Crear identidad temporal para abrir el PR
        id: pr_app
        if: steps.cambios.outputs.hubo == 'si'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.YOD_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.YOD_PUBLISHER_APP_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: read
          permission-pull-requests: write

      - name: Guardar mediante PR y checks obligatorios
        id: guardar
        if: steps.relevo.outputs.codigo == '0' && !inputs.simular
        env:
          GH_TOKEN: ${{ github.token }}
          PR_CREATION_TOKEN: ${{ steps.pr_app.outputs.token }}
        run: python3 nube/publicar_git.py integrar --proceso relevo

      - name: Publicar el commit integrado y esperar su corrida exacta
        if: steps.guardar.outputs.hubo == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.guardar.outputs.merge_sha }}
        run: python3 nube/publicar_git.py publicar --proceso relevo --sha "$MERGE_SHA"

      - name: Avisar si algo falló
        if: failure() || steps.relevo.outputs.codigo != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}      # sólo para tacharlos del log (limpiar_log.py)
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
        run: |
          gh label create "atencion" --color "D93F0B" \
            --description "Algo del ciclo de la Sala necesita una mirada" --force
          titulo="🔎 Vigía · Sala de Edición"
          numero=$(gh issue list --search "in:title \"$titulo\"" --state open \
                   --json number,title --jq ".[] | select(.title==\"$titulo\") | .number" | head -n1)
          if [ -z "$numero" ]; then
            numero=$(gh issue create --title "$titulo" \
              --body "Bitácora del ciclo de la Sala en la nube. Cada falla agrega un comentario." \
              --label "atencion" | grep -oE '[0-9]+$')
          fi
          {
            echo "## 🔴 El relevo salió con código ${{ steps.relevo.outputs.codigo }} — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "Código 2 = el Sheet no contestó · código 3 = contestó sin marcas."
            if [ "${{ steps.relevo.outputs.codigo }}" = "0" ]; then
              echo "La cosecha terminó; falló una validación, el PR o la publicación. Revisar su estado antes de reintentar."
            else
              echo "La cosecha no fue válida y no se guardó el respaldo: «no contestó» nunca es «no hay nada»."
            fi
            echo
            echo '```'
            python3 nube/limpiar_log.py relevo.log
            echo '```'
          } > comentario.md
          gh issue comment "$numero" --body-file comentario.md
          gh issue edit "$numero" --add-label "atencion"
          exit 1
