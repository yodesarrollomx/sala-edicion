# Una sola vez (23-sep): borra los avisos del Vigía que pegaron líneas «::add-mask::» con llaves.
# Se borra este archivo en cuanto corra.
name: Retirar avisos con llaves
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  retirar:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 5787108877 5789052830 5796886395; do
            gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$id" && echo "borrado $id" || echo "no se pudo $id"
          done
          gh issue comment 3 --repo "${{ github.repository }}" --body "Se retiraron 3 avisos de este hilo (22-23 sep) porque su log exponía llaves de la nube. Las llaves se están rotando y el aviso ya no pega esas líneas.

