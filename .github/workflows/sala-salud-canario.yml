name: Sala · pruebas pequeñas de motores y Drive
on:
  workflow_call:
  schedule:
    - cron: '20 12 * * *'  # 05:20 Hermosillo
  push:
    branches: [main]
    paths:
      - nube/salud_canario.py
      - .github/workflows/sala-salud-canario.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sala-salud-canario
  cancel-in-progress: false
jobs:
  canario:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Codecs y motores reales CPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          pip install --quiet google-auth requests pillow 'numpy<3' kokoro-onnx opencv-python-headless onnxruntime
      - uses: actions/cache@v4
        with:
          path: |
            nube/.cache/kokoro
            nube/.cache/depth
          key: sala-canario-kokoro-depth-v1
      - name: Pesos oficiales de voz
        run: |
          mkdir -p nube/.cache/kokoro
          test -f nube/.cache/kokoro/kokoro-v1.0.onnx || curl -fsSL -o nube/.cache/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          test -f nube/.cache/kokoro/voices-v1.0.bin || curl -fsSL -o nube/.cache/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Probar, publicar resultados sanitizados y releer recibo
        working-directory: nube
        env:
          GH_TOKEN: ${{ github.token }}
          SALA_GAS_EXEC: ${{ secrets.SALA_GAS_EXEC }}
          SALA_CLAVE_AGENTE: ${{ secrets.SALA_CLAVE_AGENTE }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: python3 salud_canario.py
