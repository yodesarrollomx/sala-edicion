<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Historias · Sala 4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<!--
  Sala 4.0 · Historias en episodios de 15 segundos (9-nov-2026).
  Lee y escribe la hoja EXPEDIENTES con acciones que el Apps Script YA atiende
  (recurso=expedientes, accion=expediente). No decide por la mesa de siempre ni la toca.
  Dueños: el editor escribe v4:universo y v4:mundo:<clase> (el canon), v4:serie:<id> y v4:dec:<id>; la nube, v4:prod, v4:canon y v4:estado.
  INVIOLABLE 11: ningún botón depende de un temporizador; el estado cambia en el clic.
-->
<style>
:root{--fondo:#f6f3ec;--tarjeta:#fffdf9;--linea:#e3ddd0;--linea2:#cfc7b6;--tinta:#1c1a16;--gris:#5f5a50;--guia:#7a7365;
  --si:#2f8a5b;--si-suave:#e3f4ea;--no:#c0503f;--no-suave:#fbe9e5;--oro:#b08637;--oro-suave:#f7edd8;--azul:#3b6ea8;--azul-suave:#e6eef8;
  --serif:'Instrument Serif',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--fondo:#131316;--tarjeta:#1b1b20;--linea:#2b2b33;--linea2:#3a3a45;--tinta:#f2efe8;--gris:#b0aa9f;--guia:#8e877c;
  --si:#57a582;--si-suave:#1c3529;--no:#d4796a;--no-suave:#3a221e;--oro:#d9b46f;--oro-suave:#332b19;--azul:#7fa6d9;--azul-suave:#1c2838}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
a{color:var(--azul)}
.app{max-width:760px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 14px}
h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--guia);font-size:14px;margin:0}
nav{display:flex;gap:6px;margin:0 0 16px;border-bottom:1px solid var(--linea);overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;color:var(--gris);font-weight:500;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--oro)}
.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:16px;margin:0 0 12px}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.entre{justify-content:space-between}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--oro-suave);color:var(--oro);white-space:nowrap}
.chip.si{background:var(--si-suave);color:var(--si)} .chip.no{background:var(--no-suave);color:var(--no)} .chip.azul{background:var(--azul-suave);color:var(--azul)}
.btn{border:1px solid var(--linea2);background:var(--tarjeta);border-radius:10px;padding:9px 14px;font-weight:600;min-height:42px}
.btn.si{background:var(--si);border-color:var(--si);color:#fff} .btn.no{color:var(--no);border-color:var(--no)}
.btn.oro{background:var(--oro);border-color:var(--oro);color:#fff} .btn.liga{border:0;background:none;color:var(--azul);padding:9px 4px}
.btn[disabled]{opacity:.5;cursor:default}
label{display:block;font-size:13px;font-weight:600;color:var(--gris);margin:10px 0 4px}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--linea2);border-radius:10px;padding:9px 11px;background:var(--fondo)}
textarea{min-height:68px;resize:vertical}
.cuenta{font-size:12.5px;color:var(--guia);font-variant-numeric:tabular-nums} .cuenta.mal{color:var(--no);font-weight:600}
.ep{border-top:1px solid var(--linea);padding:14px 0 4px} .ep:first-of-type{border-top:0;padding-top:4px}
.num{font-family:var(--serif);font-size:22px;min-width:2ch;font-variant-numeric:tabular-nums}
.dice{font-family:var(--serif);font-size:19px;line-height:1.3;margin:6px 0}
.video{width:100%;aspect-ratio:9/16;max-height:70vh;border:0;border-radius:12px;background:#000;margin:8px 0}
.aviso{border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14.5px;background:var(--azul-suave);color:var(--azul)}
.aviso.mal{background:var(--no-suave);color:var(--no)} .aviso.bien{background:var(--si-suave);color:var(--si)}
.vacio{color:var(--guia);text-align:center;padding:28px 8px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media(max-width:520px){.dos{grid-template-columns:1fr}}
ul.plano{list-style:none;margin:0;padding:0}
ul.mundo li{border-top:1px solid var(--linea);padding:10px 0} ul.mundo li:first-child{border-top:0}
details.grupo{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:4px 14px;margin:0 0 10px}
details.grupo>summary{font-family:var(--serif);font-weight:400;font-size:22px;padding:10px 0}
details.grupo .tarjeta{background:var(--fondo)}
.cuantos{font-family:var(--sans);font-size:13px;color:var(--guia);font-variant-numeric:tabular-nums}
label.casilla{font-weight:500;margin:6px 0;gap:8px;flex-wrap:nowrap;align-items:flex-start} label.casilla input{width:auto;flex:none;margin-top:4px}
#vista[inert]{opacity:.55}
</style></head>
<body>
<div class="app">
  <header>
    <div><h1>Historias</h1><p class="sub">Una historia en 10 días, un episodio de 15 segundos por día.</p></div>
    <a href="./">← La Sala</a>
  </header>
  <div id="aviso" role="status" aria-live="polite"></div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-v="series" aria-selected="true">Series</button>
    <button role="tab" data-v="universo" aria-selected="false">Universo</button>
    <button role="tab" data-v="ajustes" aria-selected="false">Ajustes</button>
  </nav>
  <main id="vista"></main>
</div>
<script>
'use strict';
const GAS_DEF='https://script.google.com/macros/s/AKfycbx61UWsEYCL_dHzi0JrUv3GuAUFSDWW4iCmlNmbDDvWBIYY4Hhqkf6sYmt4d8UGIlk7MA/exec';
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const GAS=()=>LS('sala_gas')||GAS_DEF;
const CLAVE=()=>LS('pyod_clave_v1')||LS('sala_clave')||'';     // la misma llave viva de la Sala; no se copia
const PALABRAS=38, VETADAS=['hermosillo','sonora','mexico'], USD_CLIP=1.05, USD_FICHA=0.04, LIMITE_CELDA=45000, VERSION_CANON=2;
const CLASES=['personajes','lugares','objetos'], DE_CLASE={personajes:'personaje',lugares:'lugar',objetos:'objeto'};
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plano=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const slug=t=>plano(t).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x';
const palabras=t=>String(t||'').trim().split(/\s+/).filter(Boolean).length;
const entero=(v,d=0)=>{const n=parseInt(v,10);return Number.isFinite(n)&&n>=0?n:d};
const copia=x=>JSON.parse(JSON.stringify(x));
/* El id de un archivo de Drive, venga como id o como liga; lo que no es ninguna de las dos (la liga de una carpeta, un texto) no cuenta. */
const idDrive=t=>{const x=String(t||'').trim(), m=/\/d\/([A-Za-z0-9_-]{20,})|[?&]id=([A-Za-z0-9_-]{20,})/.exec(x);return m?(m[1]||m[2]):/^[A-Za-z0-9_-]{20,}$/.test(x)?x:''};

let E={universo:null,mundo:{},serie:{},dec:{},prod:{},canon:null,estado:null}, VISTA='series', ABIERTA=null, SEMILLA=null, CARGADO=false;
const DESPLEGADAS=new Set();           // las secciones que dejó abiertas: sobreviven a cada repintado
const abierta=k=>`data-seccion="${esc(k)}"${DESPLEGADAS.has(k)?' open':''}`;

/* ---------- datos ---------- */
function separar(exp){
  const e={universo:null,mundo:{},serie:{},dec:{},prod:{},canon:null,estado:null};
  for(const [k,doc] of Object.entries(exp||{})){
    if(!k.startsWith('v4:')||!doc||typeof doc!=='object') continue;
    const [clase,...r]=k.slice(3).split(':'), id=r.join(':');
    if(['universo','estado','canon'].includes(clase)) e[clase]=doc;
    else if(clase==='mundo'&&CLASES.includes(id)) e.mundo[id]=doc;        // cada clase del mundo, en su propia celda
    else if(['serie','dec','prod'].includes(clase)&&id) e[clase][id]=doc;
  }
  return e;
}
async function cargar(){
  if(!CLAVE()){ avisar('No has entrado. Abre primero <a href="./">la Sala</a> con tu llave y vuelve.','mal'); pintar(); return }
  try{
    const r=await fetch(GAS()+'?recurso=expedientes&clave='+encodeURIComponent(CLAVE()));
    const j=JSON.parse(await r.text());
    if(!j||j.ok!==true||typeof j.expedientes!=='object') throw new Error((j&&j.error)||'la hoja no contestó');
    E=separar(j.expedientes); CARGADO=true; avisar('');
  }catch(err){ avisar('No pude leer la hoja: '+esc(err.message)+'. Lo que ves puede no estar al día.','mal') }
  if(!SEMILLA){ try{ SEMILLA=await (await fetch('datos/universo/universo.json?v='+Date.now())).json() }catch(e){} }
  pintar();
}
const AJ_FABRICA={semillero:1,propuestas_en_espera:2,episodios:10,tope_clips_dia:2,piloto_primero:1,fichas_por_dia:6,modelo_guion:'gemini-3.6-flash',modelo_ficha:'gemini-2.5-flash-image'};
const vacio=v=>!v||(typeof v==='object'&&!Object.keys(v).length);
function universo(){
  let u=copia(E.universo||SEMILLA||{});
  const base=SEMILLA||{};
  if(entero(u.version,1)<VERSION_CANON&&SEMILLA){      // guardado antes del canon: recibe lo nuevo sin perder lo suyo (igual que la nube)
    u.formato=copia(base.formato||{}); u.version=VERSION_CANON;
    for(const k of ['encuadres','objetos','canon','temporada']) if(vacio(u[k])) u[k]=copia(base[k]||(k==='temporada'?[]:k==='canon'?'':{}));
    for(const k of ['personajes','lugares']) u[k]=Object.assign({},u[k]||{},copia(base[k]||{}));
  }
  for(const c of CLASES){ const aparte=E.mundo[c];      // lo que vive en su propia celda manda; ni aparte ni adentro: el de fábrica
    if(aparte&&typeof aparte==='object') u[c]=copia(aparte); else if(!u[c]||typeof u[c]!=='object') u[c]=copia(base[c]||{}) }
  u.ajustes=Object.assign({},AJ_FABRICA,u.ajustes||{});
  for(const k of ['vertices','encuadres',...CLASES]) u[k]=(u[k]&&typeof u[k]==='object')?u[k]:{};
  u.temporada=(Array.isArray(u.temporada)?u.temporada:[]).filter(t=>t&&t.id);
  u.formato=u.formato||{};
  for(const k of ['guionista','canon']) if(!String(u[k]||'').trim()) u[k]=base[k]||'';
  delete u.historias; delete u.nota;
  return u;
}
/* Guarda uno o varios documentos, en orden: [[clase, id, doc], …]. Mientras dura, la pantalla no deja escribir ni tocar:
   al terminar se repinta y lo tecleado a media espera se perdería. Dice «Guardado» sólo cuando terminó todo. */
async function guardarVarios(partes){
  if(!CARGADO){ avisar('Todavía no leo la hoja; no guardo a ciegas. Recarga la página.','mal'); return false }
  const gorda=partes.find(([,,doc])=>JSON.stringify(doc).length>LIMITE_CELDA);
  if(gorda){ avisar(`No se guardó: ${gorda[0]==='mundo'?'los '+esc(gorda[1])+' ya son':'ya es'} demasiado texto para la hoja. Acorta descripciones o quita lo que no uses.`,'mal'); return false }
  const v=$('#vista'); let hechas=0;
  v.inert=true; v.setAttribute('aria-busy','true'); avisar('Guardando… Si tarda mucho, recarga la página.');
  try{
    for(const [clase,id,doc] of partes){
      const r=await fetch(GAS(),{method:'POST',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({accion:'expediente',clave:CLAVE(),pieza:'v4:'+clase+(id?':'+id:''),expediente:doc})});
      const j=JSON.parse(await r.text());
      if(!j||j.ok!==true) throw new Error((j&&j.error)||'sin confirmación');
      if(clase==='universo') E.universo=doc; else E[clase][id]=doc;
      hechas++;
    }
    avisar('Guardado.','bien'); return true;
  }catch(err){
    avisar((hechas?'Se guardó una parte, pero no todo: vuelve a tocar el botón de guardar. ':'No se guardó: ')+esc(err.message)+(/solo el agente/.test(err.message)?' — por ahora sólo la llave de Dirección puede editar aquí.':''),'mal');
    return false;
  }finally{ v.inert=false; v.removeAttribute('aria-busy') }
}
const guardar=(clase,id,doc)=>guardarVarios([[clase,id,doc]]);
/* El universo se guarda partido: los personajes, los lugares y los objetos van cada uno en su propia celda de la hoja
   (v4:mundo:<clase>) y lo demás en v4:universo; así el mundo puede crecer. Sólo viaja lo que cambió, y el mundo va primero. */
async function guardarUniverso(u){
  if(!CARGADO){ avisar('Todavía no leo la hoja; no guardo a ciegas. Recarga la página.','mal'); return false }
  const malas=ligasMalas(u); if(malas){ avisar(malas,'mal'); return false }
  const nucleo=Object.assign({},u), partes=[];
  for(const c of CLASES){ delete nucleo[c]; if(JSON.stringify(u[c]||{})!==JSON.stringify(E.mundo[c]||null)) partes.push(['mundo',c,u[c]||{}]) }
  if(JSON.stringify(nucleo)!==JSON.stringify(E.universo||null)) partes.push(['universo','',nucleo]);
  if(!partes.length){ avisar('No había cambios que guardar.','bien'); return true }
  return guardarVarios(partes);
}
/* Una imagen propia tiene que ser la liga de un ARCHIVO de Drive; la de una carpeta o un texto cualquiera no sirve. */
function ligasMalas(mapas){
  const malas=CLASES.flatMap(c=>Object.values(mapas[c]||{}).filter(x=>x&&String(x.referencia_drive||'').trim()&&!idDrive(x.referencia_drive)).map(x=>x.nombre||'sin nombre'));
  return malas.length?`No se guardó: la imagen de «${esc(malas.join('», «'))}» no es la liga de un archivo de Drive. Abre la imagen en Drive, copia su liga y pégala aquí; la liga de una carpeta no sirve.`:'';
}
function avisar(html,clase){ $('#aviso').innerHTML=html?`<div class="aviso ${clase||''}">${html}</div>`:'' }

/* ---------- estados derivados (la misma lógica que nube/sala_v4.py) ---------- */
const ultima=(prod,n)=>{const vs=((((prod||{}).episodios||{})[String(n)])||{}).versiones||[];return vs.length?vs[vs.length-1]:null};
function marcaVigente(dec,prod,n){
  const u=ultima(prod,n), m=(((dec||{}).episodios||{})[String(n)])||{};
  return entero(m.v)===entero((u||{}).v)?m:{};
}
const enPie=(s,dec,prod)=>(s.episodios||[]).filter(ep=>marcaVigente(dec,prod,ep.n).marca!=='no');   // «no va» = queda fuera
const aprobados=(s,dec,prod)=>(s.episodios||[]).filter(ep=>ultima(prod,ep.n)&&marcaVigente(dec,prod,ep.n).marca==='si');
function completa(s,dec,prod){ const van=aprobados(s,dec,prod); return van.length>0&&van.length===enPie(s,dec,prod).length }
function paqueteAlDia(s,dec,prod){
  const p=(prod||{}).paquete; if(!p||!completa(s,dec,prod)) return false;
  if(!p.versiones) return true;
  const van=aprobados(s,dec,prod), k=Object.keys(p.versiones);
  return k.length===van.length&&van.every(ep=>entero(p.versiones[String(ep.n)])===entero(ultima(prod,ep.n).v));
}
function estadoEp(s,dec,prod,ep){
  const u=ultima(prod,ep.n), m=marcaVigente(dec,prod,ep.n);
  if(m.marca==='no') return ['No va · queda fuera','no'];
  if(!u) return (dec||{}).serie==='si'?['En fila para producir','']:['Sin video',''];
  if(m.marca==='si') return ['Aprobado','si'];
  if(m.marca==='cambio') return ['Cambio pedido · se rehace','azul'];
  return ['Listo para que lo veas',''];
}
function estadoSerie(s,dec,prod){
  if((dec||{}).serie==='no') return ['Descartada','no'];
  if((dec||{}).serie!=='si') return [s.origen==='editor'?'Borrador tuyo · apruébala cuando esté lista':'Propuesta · espera tu decisión',''];
  if(paqueteAlDia(s,dec,prod)) return ['Paquete listo en Drive','si'];
  if(completa(s,dec,prod)) return ['Todo aprobado · la nube arma el paquete','azul'];
  const eps=enPie(s,dec,prod), ok=aprobados(s,dec,prod).length;
  const porVer=eps.filter(ep=>ultima(prod,ep.n)&&!marcaVigente(dec,prod,ep.n).marca).length;
  return [porVer?`${porVer} por revisar · ${ok} de ${eps.length} aprobados`:`En producción · ${ok} de ${eps.length} aprobados`,porVer?'':'azul'];
}
/* El mundo de una serie: lo del universo más lo suyo (lo suyo manda). */
const mundoDe=(s,u)=>Object.fromEntries(CLASES.map(c=>[c,Object.assign({},u[c],s[c]||{})]));
const llaveCanon=(s,clase,id,u)=>((s[clase]||{})[id]||!(u[clase]||{})[id])?`${s.id}:${id}`:id;
/* La imagen de referencia de un elemento: la que puso Dirección y, si no, la del canon (la pintó la nube o salió de un piloto). */
function refDe(clase,id,s,u){
  const propia=idDrive(((mundoDe(s,u)[clase]||{})[id]||{}).referencia_drive); if(propia) return [propia,'la pusiste tú'];
  const reg=(((E.canon||{})[clase]||{})[llaveCanon(s,clase,id,u)])||{};
  return reg.drive?[String(reg.drive),reg.de?'salió del piloto':'la pintó la nube']:['',''];
}
/* Por qué no se pudo pintar la imagen de un elemento, si la nube lo intentó y falló. */
const fallaDe=(clase,id,s,u)=>String(((((E.canon||{}).fallas||{})[clase+':'+llaveCanon(s,clase,id,u)])||{}).motivo||'');
/* Lo que una serie usa, en orden: protagonista, lugar, objetos, invitados y demás lugares. */
function usaDe(s,m){
  const out=[], vistos=new Set(), eps=s.episodios||[];
  const agrega=(c,id,papel)=>{ if(m[c][id]&&!vistos.has(c+id)){ vistos.add(c+id); out.push([c,id,papel]) } };
  agrega('personajes',s.personaje,'protagonista'); agrega('lugares',s.lugar,'lugar principal'); agrega('objetos',s.objeto,'objeto de la serie');
  eps.forEach(ep=>(ep.objetos||[]).forEach(o=>agrega('objetos',o,'objeto')));
  eps.forEach(ep=>{ (ep.invitados||[]).forEach(i=>agrega('personajes',i,'invitado')); agrega('lugares',ep.lugar,'lugar') });
  return out;
}
const gastoDe=prod=>Object.values((prod||{}).episodios||{}).reduce((t,e)=>t+(e.versiones||[]).reduce((x,r)=>x+(Number(r.costo_usd_aprox)||0),0),0);
function problemas(s){
  const p=[], u=universo(), m=mundoDe(s,u);
  if(!String(s.titulo||'').trim()) p.push('Falta el título.');
  if(!m.personajes[s.personaje]) p.push('Elige un personaje.');
  (s.episodios||[]).forEach((ep,i)=>{
    if(!m.lugares[ep.lugar||s.lugar]) p.push(`Episodio ${i+1}: elige un lugar.`);
    (ep.invitados||[]).forEach(g=>{ if(!m.personajes[g]) p.push(`Episodio ${i+1}: el invitado ya no existe.`) });
    (ep.objetos||[]).forEach(g=>{ if(!m.objetos[g]) p.push(`Episodio ${i+1}: un objeto ya no existe.`) });
    if(ep.encuadre&&!u.encuadres[ep.encuadre]) p.push(`Episodio ${i+1}: el encuadre ya no existe.`);
    const tomas=entero(ep.bloque,15)>=30?2:1;
    for(let t=1;t<=tomas;t++){ const suf=t===1?'':'2';
      if(!String(ep['accion'+suf]||'').trim()) p.push(`Episodio ${i+1}: falta la acción${suf?' de la segunda toma':''}.`);
      if(palabras(ep['dialogo'+suf])>PALABRAS) p.push(`Episodio ${i+1}: la frase no cabe en 15 segundos (máximo ${PALABRAS} palabras).`);
    }
  });
  CLASES.forEach(c=>Object.values(s[c]||{}).forEach(x=>{ if(x&&String(x.referencia_drive||'').trim()&&!idDrive(x.referencia_drive)) p.push(`La imagen de «${x.nombre||'sin nombre'}» no es la liga de un archivo de Drive.`) }));
  const todo=plano(JSON.stringify([s.titulo,s.trama,s.episodios,s.personajes,s.lugares,s.objetos]));
  const malas=VETADAS.filter(v=>new RegExp('(^|[^a-z0-9])'+v+'([^a-z0-9]|$)').test(todo));
  if(malas.length) p.push('Trae una ubicación vetada: '+malas.join(', ')+'.');
  return p;
}

      <div><label for="ajEsp">Propuestas del semillero en espera, como máximo (tus borradores no cuentan)</label><input type="number" id="ajEsp" min="0" max="10" value="${esc(a.propuestas_en_espera)}"></div>
      <div><label for="ajEps">Episodios por serie</label><input type="number" id="ajEps" min="1" max="30" value="${esc(a.episodios)}"></div>
      <div><label for="ajTope">Tomas de 15 segundos por día, como máximo</label><input type="number" id="ajTope" min="0" max="40" value="${esc(tope)}"></div>
      <div><label for="ajFic">Imágenes de referencia por día, como máximo</label><input type="number" id="ajFic" min="0" max="40" value="${esc(fic)}"></div>
    </div>
    <p class="sub" id="ajCosto">Gasto máximo al día: alrededor de ${(tope*USD_CLIP).toFixed(2)} USD. En 0 no se produce nada.</p>
    <p class="sub">Cada imagen de referencia cuesta alrededor de ${USD_FICHA.toFixed(2)} USD y se pinta una sola vez por personaje, lugar u objeto. Con las imágenes encendidas, un episodio espera a que lo que sale en él tenga la suya. En 0 no se pintan: la cara del protagonista se toma del primer episodio que apruebes.</p>
    <label class="fila casilla"><input type="checkbox" id="ajPil"${entero(a.piloto_primero,1)?' checked':''}> Producir primero un solo episodio (el piloto) y esperar tu «sí» antes de seguir</label>
    <div class="dos">
      <div><label for="ajMod">Modelo que escribe las historias</label><input type="text" id="ajMod" value="${esc(a.modelo_guion||'')}" autocomplete="off" spellcheck="false"></div>
      <div><label for="ajModF">Modelo que pinta las imágenes de referencia</label><input type="text" id="ajModF" value="${esc(a.modelo_ficha||'')}" autocomplete="off" spellcheck="false"></div>
    </div>
    <div class="fila" style="margin-top:14px"><button class="btn oro" data-accion="guardar-ajustes">Guardar ajustes</button></div>
  </div>
  <div class="tarjeta"><h2>Última corrida</h2>${est?`<p class="sub">${esc(String(est.cuando||'').replace('T',' ').replace('Z',' UTC'))} · ${esc(est.clips_hoy)} de ${esc(est.tope)} tomas usadas hoy${est.imagenes_hoy?` · ${esc(est.imagenes_hoy)} imágenes de referencia`:''}</p>
    <ul>${(est.pasos||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:'<p class="vacio">La nube todavía no ha corrido.</p>'}
    <p class="sub">La nube pasa varias veces al día; los horarios de GitHub no son exactos.</p></div>`;
}

/* ---------- acciones ---------- */
/* Las mismas casillas marcadas que ya había (en cualquier orden): la lista no se toca, ni se le cambia el orden. */
const mismas=(marcadas,antes)=>marcadas.length===(antes||[]).length&&marcadas.every(k=>(antes||[]).includes(k));
function recogerSerie(id){
  const s=copia(E.serie[id]);
  document.querySelectorAll('[data-serie-campo]').forEach(el=>{ s[el.dataset.serieCampo]=el.value });
  document.querySelectorAll('[data-ep][data-campo]').forEach(el=>{ const ep=s.episodios[+el.dataset.ep], c=el.dataset.campo;
    ep[c]= el.type==='checkbox'?el.checked : c==='bloque'?entero(el.value,15) : el.value });
  s.episodios.forEach((ep,i)=>{ if(ep.lugar===s.lugar) delete ep.lugar;
    for(const [attr,campo] of [['inv','invitados'],['obj','objetos']]){ const cajas=[...document.querySelectorAll(`[data-${attr}][data-de="${i}"]`)];
      if(!cajas.length) continue;
      const marcadas=cajas.filter(c=>c.checked).map(c=>c.value);
      if(!mismas(marcadas,ep[campo])) ep[campo]=marcadas } });
  document.querySelectorAll('[data-su]').forEach(el=>{ const c=el.dataset.su; if((s[c]||{})[el.dataset.k]) s[c][el.dataset.k][el.dataset.c]=el.value });
  return s;
}
function recogerUniverso(){
  const u=universo();
  // Un campo vacío que la ficha no traía no se le agrega: así lo que no se tocó queda idéntico y no se vuelve a guardar.
  document.querySelectorAll('[data-u]').forEach(el=>{ const f=(u[el.dataset.u][el.dataset.k]=u[el.dataset.u][el.dataset.k]||{}), c=el.dataset.c;
    if(el.value!==''||c in f) f[c]=el.value });
  document.querySelectorAll('[data-f]').forEach(el=>{ u.formato[el.dataset.f]=el.value });
  const gui=$('[data-g]'); if(gui) u.guionista=gui.value;
  const can=$('[data-canon]'); if(can) u.canon=can.value;
  document.querySelectorAll('[data-t]').forEach(el=>{ const t=u.temporada[+el.dataset.t], c=el.dataset.c; if(t&&(el.value!==''||c in t)) t[c]=el.value });
  u.temporada.forEach((t,i)=>{ for(const lista of ['guinos','invitados']){ const cajas=[...document.querySelectorAll(`[data-tl="${i}"][data-lista="${lista}"]`)];
    if(!cajas.length) continue;
    const marcadas=cajas.filter(c=>c.checked).map(c=>c.value).filter(k=>k!==t.protagonista||lista!=='invitados');
    if(!mismas(marcadas,t[lista])) t[lista]=marcadas } });
  return u;
}
/* Quién usa algo del universo: no se quita lo que una serie o la temporada necesita. */
function usadoPor(clase,k,u){
  for(const s of Object.values(E.serie)){ const eps=s.episodios||[], suyo=(s[clase]||{})[k];
    if(suyo) continue;
    if((clase==='personajes'&&(s.personaje===k||eps.some(e=>(e.invitados||[]).includes(k))))||(clase==='lugares'&&(s.lugar===k||eps.some(e=>e.lugar===k)))
      ||(clase==='objetos'&&(s.objeto===k||eps.some(e=>(e.objetos||[]).includes(k))))||(clase==='encuadres'&&eps.some(e=>e.encuadre===k))||(clase==='vertices'&&s.vertice===k))
      return `la serie «${s.titulo||s.id}»`;
  }
  for(const t of u.temporada){
    if((clase==='personajes'&&(t.protagonista===k||(t.invitados||[]).includes(k)))||(clase==='lugares'&&t.lugar===k)
      ||(clase==='objetos'&&(t.objeto===k||(t.guinos||[]).includes(k)))||(clase==='vertices'&&t.vertice===k)) return `la temporada («${t.titulo||t.id}»)`;
  }
  if(clase==='objetos'&&Object.values(u.personajes).some(p=>p.objeto===k)) return 'la ficha de un personaje';
  return '';
}
async function marcar(id,n,marca){
  const prod=E.prod[id]||{}, u=ultima(prod,n);
  if(marca==='vuelve') marca='';                       // regresa a la serie: se borra el «no va»
  if(!u&&marca!=='no'&&marca!=='') return;             // sin video sólo se puede dejar fuera o regresar
  let nota='';
  if(marca==='cambio'){ const el=document.querySelector(`[data-nota="${n}"]`); nota=(el&&el.value||'').trim();
    if(!nota){ avisar('Escribe qué hay que cambiar.','mal'); return } }
  const dec=copia(E.dec[id]||{}); dec.episodios=dec.episodios||{};
  dec.episodios[String(n)]={v:u?u.v:0,marca,nota,cuando:new Date().toISOString()};
  if(await guardar('dec',id,dec)) pintar();
}
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  if(b.closest('#tabs')){ VISTA=b.dataset.v; ABIERTA=null; pintar(); return }
  if(b.dataset.abrir){ ABIERTA=b.dataset.abrir; pintar(); window.scrollTo(0,0); return }
  if(b.dataset.ver){ document.querySelector(`[data-video="${b.dataset.en}"]`).innerHTML=
      `<iframe class="video" src="https://drive.google.com/file/d/${encodeURIComponent(b.dataset.ver)}/preview" allow="autoplay" title="Video del episodio"></iframe>
       <p class="sub">Si aquí no carga, toca «Abrir en Drive».</p>`; return }
  if(b.dataset.pedir){ const c=document.querySelector(`[data-cambio="${b.dataset.pedir}"]`); c.hidden=!c.hidden; if(!c.hidden) c.querySelector('textarea').focus(); return }
  if(b.dataset.marca){ await marcar(ABIERTA,b.dataset.n,b.dataset.marca); return }
  if(b.dataset.serie){ const dec=copia(E.dec[ABIERTA]||{}), partes=[]; dec.serie=b.dataset.serie; dec.cuando=new Date().toISOString();
    if(b.dataset.serie==='si'){ const s=recogerSerie(ABIERTA); if(problemas(s).length){ avisar('Corrige lo marcado antes de aprobar.','mal'); return }
      if(JSON.stringify(s)!==JSON.stringify(E.serie[ABIERTA])) partes.push(['serie',ABIERTA,s]) }      // lo que editó viaja con su aprobación, primero
    if(await guardarVarios(partes.concat([['dec',ABIERTA,dec]]))) pintar(); return }
  const a=b.dataset.accion;
  if(a==='volver'){ ABIERTA=null; pintar(); return }
  if(a==='nueva'){ const u=universo(), n=entero(u.ajustes.episodios,10), id=new Date().toISOString().slice(0,10).replace(/-/g,'')+'-nueva-'+Date.now().toString(36);
    const s={id,titulo:'',trama:'',vertice:Object.keys(u.vertices)[0]||'',personaje:Object.keys(u.personajes)[0]||'',lugar:Object.keys(u.lugares)[0]||'',objeto:'',
      episodios:Array.from({length:n},(_,i)=>({n:i+1,titulo:'',accion:'',dialogo:'',gancho:'',bloque:15,continua:false,encuadre:'',tono:'',objetos:[],invitados:[]})),origen:'editor',creada:new Date().toISOString()};
    if(await guardar('serie',id,s)){ ABIERTA=id; pintar() } return }
  if(a==='guardar-serie'){ const s=recogerSerie(ABIERTA), malas=ligasMalas(s); if(malas){ avisar(malas,'mal'); return } if(await guardar('serie',ABIERTA,s)) pintar(); return }
  const delUniverso=a==='guardar-universo'||a==='guardar-ajustes'||b.dataset.agregar||b.dataset.agregarT||b.dataset.subir||b.dataset.quitarT||b.dataset.pasar||(b.dataset.quitar&&b.dataset.de==='u');
  if(delUniverso&&!E.universo&&!SEMILLA){ avisar('No pude leer el universo de fábrica; no guardo uno vacío. Recarga la página.','mal'); return }
  if(b.dataset.pasar){                                  // algo propio de la serie pasa al mundo compartido, con su imagen
    const s=E.serie[ABIERTA], u=universo(), c=b.dataset.pasar, k=b.dataset.k, ficha=(s[c]||{})[k]; if(!ficha) return;
    const [fid]=refDe(c,k,s,u);
    u[c][k]=Object.assign({},ficha,fid?{referencia_drive:fid}:{});
    if(await guardarUniverso(u)) pintar(); return }
  if(b.dataset.quitar&&b.dataset.de==='su'){            // una ficha propia de la serie
    const s=recogerSerie(ABIERTA), c=b.dataset.quitar, k=b.dataset.k, u=universo();
    const usa=(c==='personajes'&&(s.personaje===k||s.episodios.some(e=>(e.invitados||[]).includes(k))))||(c==='lugares'&&(s.lugar===k||s.episodios.some(e=>e.lugar===k)))
      ||(c==='objetos'&&(s.objeto===k||s.episodios.some(e=>(e.objetos||[]).includes(k))));
    if(usa&&!u[c][k]){ avisar('No se quita: esta serie lo usa y no existe en el universo.','mal'); return }
    delete s[c][k]; if(await guardar('serie',ABIERTA,s)) pintar(); return }
  if(a==='guardar-universo'||b.dataset.agregar||b.dataset.quitar||b.dataset.agregarT||b.dataset.subir||b.dataset.quitarT){
    const u=recogerUniverso();
    if(b.dataset.agregar){ const c=b.dataset.agregar, nombre=(document.querySelector(`[data-nuevo="${c}"]`).value||'').trim(); if(!nombre){ avisar('Escribe el nombre primero.','mal'); return }
      let k=slug(nombre),i=2; while(u[c][k]) k=slug(nombre)+'-'+(i++);
      u[c][k]={nombre}; DESPLEGADAS.add('u:'+c+':'+k) }
    if(b.dataset.quitar){ const quien=usadoPor(b.dataset.quitar,b.dataset.k,u); if(quien){ avisar('No se quita: lo usa '+esc(quien)+'.','mal'); return } delete u[b.dataset.quitar][b.dataset.k] }
    if(b.dataset.agregarT){ const titulo=(($('[data-nuevo-t]')||{}).value||'').trim(); if(!titulo){ avisar('Escribe el título primero.','mal'); return }
      let k=slug(titulo),i=2; while(u.temporada.some(t=>t.id===k)) k=slug(titulo)+'-'+(i++);
      u.temporada.push({id:k,titulo,premisa:'',vertice:Object.keys(u.vertices)[0]||'',protagonista:Object.keys(u.personajes)[0]||'',lugar:Object.keys(u.lugares)[0]||'',objeto:'',guinos:[],invitados:[],siembra:''}); DESPLEGADAS.add('t:'+k) }
    if(b.dataset.subir){ const i=+b.dataset.subir; if(i>0) u.temporada.splice(i-1,2,u.temporada[i],u.temporada[i-1]) }
    if(b.dataset.quitarT){ u.temporada.splice(+b.dataset.quitarT,1) }
    if(await guardarUniverso(u)) pintar(); return }
  if(a==='guardar-ajustes'){ const u=universo();
    Object.assign(u.ajustes,{semillero:$('#ajSem').checked?1:0,propuestas_en_espera:entero($('#ajEsp').value,2),episodios:Math.max(1,entero($('#ajEps').value,10)),
      tope_clips_dia:entero($('#ajTope').value,0),fichas_por_dia:entero($('#ajFic').value,0),piloto_primero:$('#ajPil').checked?1:0,
      modelo_guion:$('#ajMod').value.trim()||AJ_FABRICA.modelo_guion,modelo_ficha:$('#ajModF').value.trim()||AJ_FABRICA.modelo_ficha});
    if(await guardarUniverso(u)) pintar(); return }
});
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.dataset&&/^dialogo/.test(el.dataset.campo||'')){ const c=document.querySelector(`[data-cuenta="${el.dataset.ep}${el.dataset.campo.replace('dialogo','')}"]`);
    if(c){ const n=palabras(el.value); c.textContent=n+' de '+PALABRAS+' palabras'; c.classList.toggle('mal',n>PALABRAS) } }
  if(el.id==='ajTope'){ $('#ajCosto').textContent='Gasto máximo al día: alrededor de '+(entero(el.value)*USD_CLIP).toFixed(2)+' USD. En 0 no se produce nada.' }
});
/* Lo que se abre se queda abierto aunque la pantalla se repinte al guardar (el evento no burbujea: se escucha en captura). */
document.addEventListener('toggle',ev=>{ const k=ev.target&&ev.target.dataset&&ev.target.dataset.seccion; if(k){ ev.target.open?DESPLEGADAS.add(k):DESPLEGADAS.delete(k) } },true);
cargar();
